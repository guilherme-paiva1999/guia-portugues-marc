-up: pairs avô/avó, ovo/ovos.'],['Apresentação: vogais, nasais, finais -e/-o; “leite”, “grande”, “livro”.','Presentation: vowels, nasals, final -e/-o; “leite”, “grande”, “livro”.'],['Prática: “Teste de ouvido”; repetição em coro.','Practice: “Ear test”; choral repetition.'],['Fala: frases curtas com muitas nasais e t/d (“Bom dia, tudo bem?”).','Speaking: short sentences with many nasals and t/d (“Bom dia, tudo bem?”).'],['Fecho: autoavaliação dos sons.','Wrap-up: self-assessment of the sounds.']],\n  hw:'Gravar 10 palavras com t/d + i e com nasais.',hwE:'Record 10 words with t/d + i and with nasals.'},\n {t:'Sons do Brasil II e IPA',te:'Sounds of Brazil II and IPA',m:'03-sons-e-fonetica.html',obj:'L final, R, S/Z, ch/j/lh/nh, tabela IPA, sílaba tônica, trava-línguas.',objE:'Final L, R, S/Z, ch/j/lh/nh, IPA chart, stressed syllable, tongue twisters.',\n  steps:[['Aquecimento: revisar o -e final.','Warm-up: review the final -e.'],['Apresentação: consoantes que mudam tudo; tabela IPA como consulta.','Presentation: consonants that change everything; IPA chart as a reference.'],['Prática: sílaba tônica; leitura de palavras do texto do Marc.','Practice: stressed syllable; reading words from Marc’s text.'],['Fala: trava-línguas devagar e depois em velocidade normal.','Speaking: tongue twisters slowly, then at normal speed.'],['Fecho: quiz “Qual é o som?”.','Wrap-up: “Which sound is it?” quiz.']],\n  hw:'Praticar 2 trava-línguas, 5 min por dia.',hwE:'Practice 2 tongue twisters, 5 min a day.'},\n {t:'Apresentação do Marc',te:\"Marc's introduction\",m:'04-apresentacao.html',obj:'Ler, entender e dizer o texto pessoal; contar a própria história.',objE:'Read, understand and say the personal text; tell his own story.',\n  steps:[['Aquecimento: perguntas “Como você se chama? De onde você é?”.','Warm-up: questions “What is your name? Where are you from?”.'],['Apresentação: texto do Marc frase por frase; vocabulário e passado.','Presentation: Marc’s text sentence by sentence; vocabulary and past tense.'],['Prática: lacunas, frases em ordem, compreensão.','Practice: gaps, sentences in order, comprehension.'],['Fala: o Marc conta a história sem olhar para o texto.','Speaking: Marc tells the story without looking at the text.'],['Fecho: “Agora é com você” (versão personalizada).','Wrap-up: “Now it’s your turn” (personalized version).']],\n  hw:'Gravar a apresentação em 30 segundos.',hwE:'Record the introduction in 30 seconds.'},\n {t:'Gramática I: pronomes, ser/estar, verbos',te:'Grammar I: pronouns, ser/estar, verbs',m:'05-gramatica-basica.html',obj:'Usar eu, você, ele/ela, a gente; ser × estar; presente de ter, ir, querer, morar, falar, gostar.',objE:'Use eu, você, ele/ela, a gente; ser vs estar; present tense of ter, ir, querer, morar, falar, gostar.',\n  steps:[['Aquecimento: “Onde você mora? Quantos anos você tem?”.','Warm-up: “Where do you live? How old are you?”.'],['Apresentação: pronomes; ser × estar; verbos irregulares básicos.','Presentation: pronouns; ser vs estar; basic irregular verbs.'],['Prática: lacunas com escolha; conjugador; quiz de verbos.','Practice: multiple-choice gaps; conjugator; verb quiz.'],['Fala: 6 frases com ser, estar, ter.','Speaking: 6 sentences with ser, estar, ter.'],['Fecho: erros do dia.','Wrap-up: mistakes of the day.']],\n  hw:'Escrever 8 frases sobre a rotina usando 4 verbos novos.',hwE:'Write 8 sentences about the routine using 4 new verbs.'},\n {t:'Gramática II: artigos, contrações, perguntas',te:'Grammar II: articles, contractions, questions',m:'05-gramatica-basica.html',obj:'Artigos, gênero e plural; no/na/do/da; palavras interrogativas; negação.',objE:'Articles, gender and plural; no/na/do/da; question words; negation.',\n  steps:[['Aquecimento: revisar verbos.','Warm-up: review verbs.'],['Apresentação: artigos e gênero; países e contrações.','Presentation: articles and gender; countries and contractions.'],['Prática: quiz de gênero; lacunas de contrações; “Associar pergunta e resposta”.','Practice: gender quiz; contraction gaps; “Match question and answer”.'],['Fala: entrevista com 8 perguntas.','Speaking: interview with 8 questions.'],['Fecho: “por que × porque”.','Wrap-up: “por que vs porque”.']],\n  hw:'Fazer 5 perguntas para um amigo brasileiro.',hwE:'Ask a Brazilian friend 5 questions.'},\n {t:'Números, datas, horas e dinheiro',te:'Numbers, dates, time and money',m:'06-numeros-e-tempo.html',obj:'Números até 1000 e anos; datas; horas; preços e Pix.',objE:'Numbers up to 1000 and years; dates; time; prices and Pix.',\n  steps:[['Aquecimento: contar de 10 em 10.','Warm-up: count by tens.'],['Apresentação: 0–100, centenas, anos (“mil novecentos e setenta e sete”).','Presentation: 0–100, hundreds, years (“mil novecentos e setenta e sete”).'],['Prática: gerador de números; quiz de números, horas, dinheiro.','Practice: number generator; quizzes on numbers, time, money.'],['Fala: idade, ano de nascimento, data de hoje, “Quanto custa?”.','Speaking: age, birth year, today’s date, “How much is it?”.'],['Fecho: ditado de números.','Wrap-up: number dictation.']],\n  hw:'Ditar o número de telefone e a data de nascimento.',hwE:'Dictate the phone number and the date of birth.'},\n {t:'Brasil × Portugal',te:'Brazil vs Portugal',m:'07-brasil-x-portugal.html',obj:'Reconhecer e usar as diferenças de pronúncia, gramática e vocabulário.',objE:'Recognize and use the differences in pronunciation, grammar and vocabulary.',\n  steps:[['Aquecimento: “Como se diz autocarro no Brasil?”.','Warm-up: “How do you say autocarro in Brazil?”.'],['Apresentação: pronúncia e gramática; “estou falando” × “estou a falar”.','Presentation: pronunciation and grammar; “estou falando” vs “estou a falar”.'],['Prática: flashcards; “Brasil ou Portugal?”; palavras perigosas.','Practice: flashcards; “Brazil or Portugal?”; dangerous words.'],['Fala: contar a mesma frase em estilo brasileiro.','Speaking: say the same sentence in Brazilian style.'],['Fecho: vocabulário de vida prática (CPF, Pix, aluguel).','Wrap-up: practical-life vocabulary (CPF, Pix, aluguel).']],\n  hw:'Ouvir 15 min de podcast brasileiro e anotar 5 palavras.',hwE:'Listen to 15 min of a Brazilian podcast and note 5 words.'},\n {t:'Revisão e role-play',te:'Review and role-play',m:'08-praticar.html',obj:'Consolidar o A1, simular situações reais, reavaliar.',objE:'Consolidate A1, simulate real situations, reassess.',\n  steps:[['Aquecimento: “Frase do dia”.','Warm-up: “Sentence of the day”.'],['Apresentação: revisão dos erros mais frequentes.','Presentation: review of the most frequent mistakes.'],['Prática: revisão geral, ditado, associação.','Practice: general review, dictation, matching.'],['Fala: 2 cenas de role-play (abaixo).','Speaking: 2 role-play scenes (below).'],['Fecho: refazer a autoavaliação e definir metas do A2.','Wrap-up: redo the self-assessment and set A2 goals.']],\n  hw:'Plano de estudo para as próximas 4 semanas.',hwE:'Study plan for the next 4 weeks.'}\n];\nG.$('#lessons').innerHTML = LS.map(function(l,n){\n  var key = 'roteiro:'+n;\n  return '\u003cdetails class=\"lesson\">\u003csummary>Aula '+(n+1)+' · '+l.t+tr('Lesson '+(n+1)+' · '+l.te)+'\u003c/summary>\u003cdiv class=\"in\">\u003cp>\u003cb>Objetivo:\u003c/b> '+l.obj+tr('Goal')+'\u003c/p>\u003cp class=\"tr\">'+l.objE+'\u003c/p>\u003cp>\u003ca href=\"'+l.m+'\">Abrir o módulo da aula'+tr('Open the lesson module')+'\u003c/a>\u003c/p>'\n   + l.steps.map(function(s,k){ var kk = key+':'+k; return '\u003clabel class=\"chk\">\u003cinput type=\"checkbox\" data-k=\"'+kk+'\"'+(G.Store.get(kk,false)?' checked':'')+'>\u003cspan>'+s[0]+'\u003cspan class=\"tr\" style=\"display:block\">'+s[1]+'\u003c/span>\u003c/span>\u003c/label>'; }).join('')\n   + '\u003cp style=\"margin:10px 0 0\">\u003cb>Tarefa:\u003c/b> '+l.hw+tr('Homework')+'\u003c/p>\u003cp class=\"tr\">'+l.hwE+'\u003c/p>\u003c/div>\u003c/details>';\n}).join('');\ndocument.addEventListener('change', function(e){ var c = e.target; if(c && c.matches && c.matches('input[type=checkbox][data-k]')) G.Store.set(c.getAttribute('data-k'), c.checked); });\n\nvar ER = [\n ['“s” inicial lido como “z”','Em alemão “Sonne” começa com [z]. Em português “sapo, sol, sim” começam com [s].','sapo, sol, sim, sete','Initial “s” read as “z”','In German “Sonne” starts with [z]. In Portuguese “sapo, sol, sim” start with [s].'],\n ['“z” lido como “ts”','“Zeit” tem [ts]. Em português “zebra, zero” são só [z].','zebra, zero, azul','“z” read as “ts”','“Zeit” has [ts]. In Portuguese “zebra, zero” are just [z].'],\n ['“v” lido como “f”','Em alemão “Vater” tem [f]. Em português “v” = [v] (alemão “W”).','vaca, vinho, vida, verde','“v” read as “f”','In German “Vater” has [f]. In Portuguese “v” = [v] (German “W”).'],\n ['“j” lido como “y”','Em alemão “ja” tem [j]. Em português “j” = [ʒ] (como em “Garage”).','janela, já, jogo, hoje','“j” read as “y”','In German “ja” has [j]. In Portuguese “j” = [ʒ] (as in “Garage”).'],\n ['“ch” lido como [ç] ou [x]','Em português “ch” = “sh” ([ʃ]).','chuva, chave, chá, mochila','“ch” read as [ç] or [x]','In Portuguese “ch” = “sh” ([ʃ]).'],\n ['“-e” final como schwa','Em português o -e final soa como “i”.','leite, grande, noite, parte','Final “-e” as a schwa','In Portuguese the final -e sounds like “i”.'],\n ['“h” pronunciado','O “h” é mudo em português.','hotel, hoje, homem, hora','Pronounced “h”','The “h” is silent in Portuguese.'],\n ['“qu” lido como [kv]','Em português “qu” é [k] antes de e/i.','queijo, quilo, quente, aqui','“qu” read as [kv]','In Portuguese “qu” is [k] before e/i.'],\n ['“ei” e “eu” lidos como em alemão','“ei” = [ej] e “eu” = [ew].','meu, leite, feira, seu','“ei” and “eu” read as in German','“ei” = [ej] and “eu” = [ew].'],\n ['nasais com “m/n” extra','A vogal é nasal; não se diz o “m” ou “n” final.','bom, sim, pão, mãe','Nasals with an extra “m/n”','The vowel is nasal; the final “m” or “n” is not pronounced.'],\n ['R intervocálico forte','Entre vogais o R é rápido, como em “butter”.','caro, hora, para, parede','Strong R between vowels','Between vowels the R is quick, as in “butter”.'],\n ['acento da palavra na primeira sílaba','O alemão acentua a primeira sílaba; em português a tônica varia.','Brasil, português, alemão, família','Word stress on the first syllable','German stresses the first syllable; in Portuguese the stress varies.'],\n ['“aspiração” excessiva de p/t/k','Em português p, t, k têm menos sopro.','pato, tatu, casa, quanto','Too much aspiration of p/t/k','In Portuguese p, t, k have less breath.'],\n ['“ser 48 anos”','Em alemão “ich bin 48”; em português a idade usa TER.','Eu tenho 48 anos.','“ser 48 anos”','In German “ich bin 48”; in Portuguese age uses TER.'],\n ['“gosto viajar”','“Gostar” pede “de”.','Eu gosto de viajar.','“gosto viajar”','“Gostar” needs “de”.'],\n ['“moro no Portugal”','Portugal não leva artigo: “em Portugal”.','Eu moro em Portugal.','“moro no Portugal”','Portugal takes no article: “em Portugal”.']\n];\nU.table(G.$('#errors'), ['Erro provável','Por quê e como corrigir','Pratique','Ouvir'], ER.map(function(e){ return ['\u003cb>'+e[0]+'\u003c/b>'+tr(e[3]),e[1]+'\u003cspan class=\"tr\" style=\"display:block\">'+e[4]+'\u003c/span>','\u003cspan class=\"pt\">'+e[2]+'\u003c/span>',U.both(e[2])]; }));\n\nvar RP = [\n ['No aeroporto','At the airport','Pessoa A: Boa tarde. Seu passaporte, por favor. · Marc: Aqui está. · A: Quanto tempo você vai ficar? · Marc: Eu vou morar aqui.','Person A: Good afternoon. Your passport, please. · Marc: Here it is. · A: How long will you stay? · Marc: I am going to live here.'],\n ['Na padaria','At the bakery','Atendente: Bom dia! O que vai ser? · Marc: Bom dia! Um pão na chapa e um cafezinho, por favor. · A: Mais alguma coisa? · Marc: Só isso. Quanto é? · A: Oito reais. · Marc: Aceita Pix?','Clerk: Good morning! What will it be? · Marc: Good morning! A grilled bread roll and a small coffee, please. · A: Anything else? · Marc: Just that. How much is it? · A: Eight reais. · Marc: Do you accept Pix?'],\n ['Alugar um apartamento','Renting <script>
(function(){
  var shell = JSON.parse(document.getElementById('shell').textContent);
  var pages = JSON.parse(document.getElementById('pages').textContent);
  var order = ["index.html","01-comecando.html","02-alfabeto.html","03-sons-e-fonetica.html","04-apresentacao.html","05-gramatica-basica.html","06-numeros-e-tempo.html","07-brasil-x-portugal.html","08-praticar.html","09-roteiro-de-aulas.html"];
  var nav = [["index.html","Início","Home"],["01-comecando.html","Começando","Getting started"],["02-alfabeto.html","Alfabeto","Alphabet"],["03-sons-e-fonetica.html","Sons e IPA","Sounds & IPA"],["04-apresentacao.html","Apresentação","Introduction"],["05-gramatica-basica.html","Gramática","Grammar"],["06-numeros-e-tempo.html","Números e tempo","Numbers & time"],["07-brasil-x-portugal.html","Brasil × Portugal","Brazil vs Portugal"],["08-praticar.html","Praticar","Practice"],["09-roteiro-de-aulas.html","Roteiro","Lesson plan"]];
  var frames = {};
  function build(file){
    var p = pages[file];
    var navHtml = nav.map(function(n){ return '<a href="'+n[0]+'"'+(n[0]===file?' aria-current="page"':'')+'>'+n[1]+'<small class="tr">'+n[2]+'</small></a>'; }).join('');
    return shell.replace('{{TITLE}}', function(){ return p.title; })
      .replace('{{ID}}', function(){ return p.id; })
      .replace('{{NAV}}', function(){ return navHtml; })
      .replace('{{BODY}}', function(){ return p.body; });
  }
  function show(file, noHash){
    if(!pages[file]) file = 'index.html';
    order.forEach(function(f){ if(frames[f]) frames[f].classList.remove('on'); });
    if(!frames[file]){
      var fr = document.createElement('iframe');
      fr.title = pages[file].title;
      fr.setAttribute('allow','microphone');
      fr.srcdoc = build(file);
      document.body.appendChild(fr);
      frames[file] = fr;
    }
    frames[file].classList.add('on');
    document.title = pages[file].title + ' \u00b7 Portugu\u00eas do Brasil';
    if(!noHash){ try{ history.pushState(null,'','#'+pages[file].id); }catch(e){ location.hash = pages[file].id; } }
    try{ frames[file].contentWindow.focus(); }catch(e){}
  }
  function fromHash(){
    var id = location.hash.replace('#','');
    var f = order.filter(function(x){ return pages[x].id===id; })[0];
    return f || 'index.html';
  }
  window.addEventListener('message', function(e){ if(e.data && e.data.guiaGo) show(e.data.guiaGo); });
  window.addEventListener('popstate', function(){ show(fromHash(), true); });
  window.addEventListener('hashchange', function(){ show(fromHash(), true); });
  show(fromHash(), true);
})();
</script>
