clabel for=\"fLike\">Eu gosto de…\u003cspan class=\"tr\"> · I like to…\u003c/span>\u003c/label>\u003cselect id=\"fLike\">\u003coption value=\"viajar\" data-en=\"travel\">viajar (travel)\u003c/option>\u003coption value=\"cozinhar\" data-en=\"cook\">cozinhar (cook)\u003c/option>\u003coption value=\"ler\" data-en=\"read\">ler (read)\u003c/option>\u003coption value=\"caminhar\" data-en=\"walk\">caminhar (walk)\u003c/option>\u003coption value=\"ouvir música\" data-en=\"listen to music\">ouvir música (listen to music)\u003c/option>\u003coption value=\"conhecer pessoas\" data-en=\"meet people\">conhecer pessoas (meet people)\u003c/option>\u003coption value=\"aprender idiomas\" data-en=\"learn languages\">aprender idiomas (learn languages)\u003c/option>\u003c/select>\u003c/div>\n  \u003cdiv class=\"row\">\u003cbutton type=\"button\" class=\"btn pri\" id=\"fGo\">Montar minha apresentação\u003cspan class=\"tr\"> · Build my introduction\u003c/span>\u003c/button>\u003c/div>\n  \u003cdiv id=\"fOut\">\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"callout prof\">\n  \u003cb class=\"t\">Para a professora\u003cspan class=\"tr\"> · For the teacher\u003c/span>\u003c/b>\n  \u003cp>Sequência sugerida: (1) leitura em coro, frase por frase; (2) o Marc lê sozinho; (3) perguntas de compreensão em português; (4) ele conta a história sem olhar, usando só os verbos-chave: \u003ci>nascer, morar, viajar, vir, ficar, querer\u003c/i>; (5) ele grava um áudio de 30 segundos como tarefa. Se o Marc preferir outra forma de mencionar o parceiro ou a parceira, ajuste a frase 7 (“namorado/a”, “esposa/marido”).\u003c/p>\n  \u003cp class=\"tr\">Suggested sequence: (1) choral reading, sentence by sentence; (2) Marc reads alone; (3) comprehension questions in Portuguese; (4) he tells the story without looking, using only key verbs: nascer, morar, viajar, vir, ficar, querer; (5) he records a 30-second audio as homework. If Marc prefers another way to refer to his partner, adjust sentence 7 (“namorado/a”, “esposa/marido”).\u003c/p>\n\u003c/div>\n\n\u003cbutton type=\"button\" class=\"btn complete\" data-complete>Marcar módulo como concluído\u003c/button>\n\n\u003cscript>\n(function(){\nvar G = window.G, U = G.UI, PT = G.PT;\n/* ---- story ---- */\nfunction sentences(){\n  var p = G.$('#partner').value;\n  return [\n   {pt:'Oi, meu nome é Marc.', en:'Hi, my name is Marc.'},\n   {pt:'Nasci em 1977, então tenho 48 anos.', say:'Nasci em mil novecentos e setenta e sete, então tenho quarenta e oito anos.', en:'I was born in 1977, so I am 48 years old.'},\n   {pt:'Eu sou da Alemanha, mas gosto de viajar e de morar em países diferentes.', en:'I am from Germany, but I like to travel and live in different countries.'},\n   {pt:'Morei no Vietnã e na Malásia por muitos anos e viajei por toda a Ásia.', en:'I lived in Vietnam and Malaysia for many years and travelled all over Asia.'},\n   {pt:'Há dois anos eu vim para Portugal e acabei ficando, porque gosto muito daqui.', en:'Two years ago I came to Portugal and ended up staying, because I like it here very much.'},\n   {pt:'Por isso eu quero aprender a falar português como um brasileiro.', en:'That is why I want to learn to speak Portuguese like a Brazilian.'},\n   {pt:'Um dos meus objetivos para o futuro é realmente me mudar para o Brasil com '+p+' e morar lá.', en:'One of my goals for the future is to actually move to Brazil with my partner and live there.'}\n  ];\n}\nvar story = G.$('#story'), cur = [];\nfunction drawStory(){\n  cur = sentences();\n  story.innerHTML = cur.map(function(s,n){ var say = s.say || s.pt;\n    return '\u003cdiv class=\"sentence\" data-n=\"'+n+'\">\u003cdiv class=\"tx\">\u003cdiv class=\"pt-s\">'+s.pt+'\u003c/div>\u003cdiv class=\"en en-s\">'+s.en+'\u003c/div>\u003cdiv class=\"listen\" data-n=\"'+n+'\">\u003c/div>\u003c/div>'+U.say(say)+U.say(say,{slow:true})+'\u003c/div>'; }).join('');\n  G.$$('.listen', story).forEach(function(b){ G.Listen.attach(b, cur[+b.getAttribute('data-n')].pt); });\n}\ndrawStory();\nG.$('#partner').addEventListener('change', drawStory);\nG.$('#playAll').addEventListener('click', function(){\n  G.TTS.seq(cur.map(function(s){ return {text:s.say||s.pt}; }), function(ev, i){\n    G.$$('.sentence', story).forEach(function(x){ x.classList.remove('playing'); });\n    if(ev==='item') G.$$('.sentence', story)[i].classList.add('playing');\n  });\n});\nG.$('#stopAll').addEventListener('click', function(){ G.TTS.stop(); G.$$('.sentence', story).forEach(function(x){ x.classList.remove('playing'); }); });\nvar en = true;\nG.$('#toggleEn').addEventListener('click', function(){ en = !en; story.classList.toggle('hide-en', !en); this.textContent = en ? 'Esconder inglês · Hide English' : 'Mostrar inglês · Show English'; });\n\n/* ---- vocab ---- */\nvar V = [\n ['nascer → \u003cb>nasci\u003c/b>','to be born → I was born',''],\n ['então','so, then',''],\n ['ter → \u003cb>tenho\u003c/b> 48 anos','I am 48 (Portuguese “has” years)','Age uses \u003ci>ter\u003c/i>, not \u003ci>ser\u003c/i>.'],\n ['ser de → \u003cb>sou\u003c/b> da Alemanha','to be from','de + a = da · de + o = do'],\n ['mas','but',''],\n ['gostar de','to like','Always with \u003ci>de\u003c/i>: gosto de viajar.'],\n ['viajar → \u003cb>viajei\u003c/b>','to travel → I travelled',''],\n ['morar → \u003cb>morei\u003c/b>','to live (reside) → I lived','In Brazil \u003ci>morar\u003c/i> is the usual verb for “live in”.'],\n ['em + o = \u003cb>no\u003c/b>, em + a = \u003cb>na\u003c/b>','in the','no Vietnã, na Malásia'],\n ['por muitos anos','for many years',''],\n ['toda a Ásia','all of Asia',''],\n ['há dois anos','two years ago',''],\n ['vir → \u003cb>vim\u003c/b>','to come → I came',''],\n ['ficar → \u003cb>fiquei\u003c/b>','to stay → I stayed','acabei ficando = I ended up staying'],\n ['porque','because',''],\n ['daqui','from/of here','de + aqui'],\n ['por isso','that is why',''],\n ['querer → \u003cb>quero\u003c/b>','to want → I want',''],\n ['aprender a falar','to learn to speak','aprender \u003cb>a\u003c/b> + verb'],\n ['como um brasileiro','like a Brazilian','como = like/as'],\n ['objetivo','goal',''],\n ['me mudar para','to move to',''],\n ['parceiro / parceira','partner',''],\n ['lá','there','aqui = here · lá = there']\n];\nU.table(G.$('#vocab'), ['Português','English','Nota'], V);\n\nU.table(G.$('#past'), ['Infinitivo','Eu (passado)','Frase do texto','Ouvir'], [\n ['nascer','\u003cb>nasci\u003c/b>','Nasci em 1977.'+G.trB('I was born in 1977.'),U.both('Nasci em mil novecentos e setenta e sete.')],\n ['morar','\u003cb>morei\u003c/b>','Morei no Vietnã.'+G.trB('I lived in Vietnam.'),U.both('Morei no Vietnã.')],\n ['viajar','\u003cb>viajei\u003c/b>','Viajei por toda a Ásia.'+G.trB('I travelled all over Asia.'),U.both('Viajei por toda a Ásia.')],\n ['vir','\u003cb>vim\u003c/b>','Eu vim para Portugal.'+G.trB('I came to Portugal.'),U.both('Eu vim para Portugal.')],\n ['ficar','\u003cb>fiquei\u003c/b>','Eu fiquei em Portugal.'+G.trB('I stayed in Portugal.'),U.both('Eu fiquei em Portugal.')]\n]);\n\n/* ---- cloze ---- */\nG.Cloze.mount(G.$('#cloze'), { bank:['nome','Nasci','tenho','sou','gosto','Morei','anos','vim','fiquei','quero','falar'], items:[\n {t:'Oi, meu [[nome]] é Marc.', en:'Hi, my name is Marc.'},\n {t:'[[Nasci]] em 1977, então [[tenho]] 48 anos.', en:'I was born in 1977, so I am 48.'},\n {t:'Eu [[sou]] da Alemanha, mas [[gosto]] de viajar.', en:'I am from Germany, but I like to travel.'},\n {t:'[[Morei]] no Vietnã e na Malásia por muitos [[anos]].', en:'I lived in Vietnam and Malaysia for many years.'},\n {t:'Há dois anos eu [[vim]] para Portugal e [[fiquei]].', en:'Two years ago I came to Portugal and stayed.'},\n {t:'Por isso eu [[quero]] aprender a [[falar]] português.', en:'That is why I want to learn to speak Portuguese.'}\n]});\n\n/* ---- reorder ---- */\nG.Reorder.mount(G.$('#order'), [\n {pt:'Eu sou da Alemanha.', en:'I am from Germany.'},\n {pt:'Morei no Vietnã e na Malásia.', en:'I lived in Vietnam and Malaysia.'},\n {pt:'Eu quero morar no Brasil.', en:'I want to live in Brazil.'},\n {pt:'Gosto muito de viajar.', en:'I like travelling a lot.'},\n {pt:'Há dois anos eu vim para Portugal.', en:'Two years ago I came to Portugal.'}\n]);\n\n/* ---- comprehension ---- */\n(function(){ var T = G.tr, B = G.trB;\nG.Quiz.mount(G.$('#qComp'), { id:'compreensao', shuffle:true, questions:[\n {q:'De onde o Marc é?'+T('Where is Marc from?'), options:['Da Alemanha'+B('From Germany'),'Do Brasil'+B('From Brazil'),'De Portugal'+B('From Portugal'),'Da Malásia'+B('From Malaysia')], answer:0, keepOrder:true},\n {q:'Quantos anos o Marc tem?'+T('How old is Marc?'), options:['38','48','58'], answer:1, keepOrder:true, why:'\u003ci>Tenho quarenta e oito anos.\u003c/i>'+B('I am forty-eight.')},\n {q:'Onde o Marc morou por muitos anos?'+T('Where did Marc live for many years?'), options:['No Vietnã e na Malásia'+B('In Vietnam and Malaysia'),'No Brasil'+B('In Brazil'),'Na França'+B('In France')], answer:0, keepOrder:true},\n {q:'Há quanto tempo o Marc está em Portugal?'+T('How long has Marc been in Portugal?'), options:['Há dois anos'+B('Two years'),'Há vinte anos'+B('Twenty years'),'Há dois meses'+B('Two months')], answer:0, keepOrder:true},\n {q:'Por que ele quer aprender português?'+T('Why does he want to learn Portuguese?'), options:['Porque quer viajar pela Europa'+B('Because he wants to travel around Europe'),'Porque quer morar no Brasil'+B('Because he wants to live in Brazil'),'Porque quer trabalhar na Ásia'+B('Because he wants to work in Asia')], answer:1, keepOrder:true},\n {q:'Listen and choose the sentence you hear.', say:'Eu moro em Portugal há dois anos.', options:['Eu moro em Portugal há dois anos.'+B('I have lived in Portugal for two years.'),'Eu morei em Portugal há dois anos.'+B('I lived in Portugal two years ago.'),'Eu moro no Brasil há dois anos.'+B('I have lived in Brazil for two years.')], answer:0, keepOrder:true},\n {type:'type', q:'Escreva em português: \u003ci>I want to live in Brazil.\u003c/i>'+T('Write in Portuguese'), answer:['Eu quero morar no Brasil.','Quero morar no Brasil.'], why:'\u003ci>Quero\u003c/i> + infinitive.'}\n]});\n})();\n\n/* ---- interview ---- */\nvar IV = [];\nfunction drawInterview(){\n  var T = G.tr;\n  IV = [\n   ['Como você se chama?','Eu me chamo Marc. / Meu nome é Marc.','What is your name?','I call myself Marc. / My name is Marc.'],\n   ['De onde você é?','Eu sou da Alemanha.','Where are you from?','I am from Germany.'],\n   ['Quantos anos você tem?','Eu tenho quarenta e oito anos.','How old are you?','I am forty-eight years old.'],\n   ['Onde você mora?','Eu moro em Portugal.','Where do you live?','I live in Portugal.'],\n   ['Onde você morou antes?','Eu morei no Vietnã e na Malásia.','Where did you live before?','I lived in Vietnam and Malaysia.'],\n   ['O que você gosta de fazer?','Eu gosto de viajar.','What do you like to do?','I like to travel.'],\n   ['Por que você quer aprender português?','Porque eu quero morar no Brasil.','Why do you want to learn Portuguese?','Because I want to live in Brazil.'],\n   ['Com quem você vai morar no Brasil?','Eu vou morar lá com '+G.$('#partner').value+'.','Who will you live with in Brazil?','I am going to live there with my partner.']\n  ];\n  G.$('#interview').innerHTML = IV.map(function(q,n){ return '\u003cdiv class=\"sentence\">\u003cdiv class=\"tx\">\u003cdiv class=\"pt-s\">'+q[0]+' '+U.say(q[0])+'\u003c/div>\u003cdiv class=\"tr\">'+q[2]+'\u003c/div>\u003cdetails class=\"fold\" style=\"margin:6px 0 0\">\u003csummary>Resposta modelo'+T('Model answer')+'\u003c/summary>\u003cdiv>\u003cdiv class=\"pt-s\">'+q[1]+' '+U.both(q[1])+'\u003c/div>\u003cdiv class=\"tr\">'+q[3]+'\u003c/div>\u003cdiv class=\"listen\" data-n=\"'+n+'\">\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>'; }).join('');\n  G.$$('#interview .listen').forEach(function(b){ G.Listen.attach(b, IV[+b.getAttribute('data-n')][1].split(' / ')[0]); });\n}\ndrawInterview();\nG.$('#partner').addEventListener('change', drawInterview);\n\n/* ---- builder ---- */\nvar C = [['Alemanha','da Alemanha','na Alemanha'],['Áustria','da Áustria','na Áustria'],['Suíça','da Suíça','na Suíça'],['Portugal','de Portugal','em Portugal'],['Brasil','do Brasil','no Brasil'],['França','da França','na França'],['Itália','da Itália','na Itália'],['Espanha','da Espanha','na Espanha'],['Inglaterra','da Inglaterra','na Inglaterra'],['Estados Unidos','dos Estados Unidos','nos Estados Unidos'],['Canadá','do Canadá','no Canadá'],['Japão','do Japão','no Japão'],['Vietnã','do Vietnã','no Vietnã'],['Malásia','da Malásia','na Malásia']];\nvar CE = {'Alemanha':'Germany','Áustria':'Austria','Suíça':'Switzerland','Portugal':'Portugal','Brasil':'Brazil','França':'France','Itália':'Italy','Espanha':'Spain','Inglaterra':'England','Estados Unidos':'the United States','Canadá':'Canada','Japão':'Japan','Vietnã':'Vietnam','Malásia':'Malaysia'};\nG.$('#fFrom').innerHTML = C.map(function(c){ return '\u003coption value=\"'+c[1]+'\" data-en=\"'+CE[c[0]]+'\"'+(c[0]==='Alemanha'?' selected':'')+'>'+c[1]+' ('+CE[c[0]]+')\u003c/option>'; }).join('');\nG.$('#fLive').innerHTML = C.map(function(c){ return '\u003coption value=\"'+c[2]+'\" data-en=\"'+CE[c[0]]+'\"'+(c[0]==='Portugal'?' selected':'')+'>'+c[2]+' ('+CE[c[0]]+')\u003c/option>'; }).join('');\nG.$('#fGo').addEventListener('click', function(){\n  var name = G.$('#fName').value.trim() || 'Marc', age = parseInt(G.$('#fAge').value,10);\n  var lines = [\n   'Oi, meu nome é '+name+'.',\n   'Eu tenho '+age+' anos.',\n   'Eu sou '+G.$('#fFrom').value+'.',\n   'Eu moro '+G.$('#fLive').value+'.',\n   'Eu gosto de '+G.$('#fLike').value+'.'\n  ];\n  var say = lines.slice(); say[1] = 'Eu tenho '+PT.num(age)+' anos.';\n  var en = function(id){ return G.$('#'+id).selectedOptions[0].getAttribute('data-en'); };\n  var ens = ['Hi, my name is '+name+'.','I am '+age+' years old.','I am from '+en('fFrom')+'.','I live in '+en('fLive')+'.','I like to '+en('fLike')+'.'];\n  G.$('#fOut').innerHTML = '\u003cdiv class=\"callout tip\" style=\"margin-top:12px\">'+lines.map(function(l,n){ return '\u003cdiv class=\"sentence\">\u003cdiv class=\"tx\">\u003cdiv class=\"pt-s\">'+G.esc(l)+'\u003c/div>\u003cdiv class=\"tr\">'+G.esc(ens[n])+'\u003c/div>\u003c/div>'+U.say(say[n])+'\u003c/div>'; }).join('')+'\u003cp style=\"margin:10px 0 0\">\u003cbutton type=\"button\" class=\"btn\" id=\"fAll\">▶ Ouvir tudo'+G.tr('Play all')+'\u003c/button>\u003c/p>\u003c/div>';\n  G.$('#fAll').addEventListener('click', function(){ G.TTS.seq(say.map(function(t){ return {text:t}; })); });\n});\n})();\n\u003c/script>\n"},"05-gramatica-basica.html":{"id":"gramatica","title":"Gramática","body":"\u003ch1>Gramática básica\u003cspan class=\"tr\">Basic grammar\u003c/span>\u003c/h1>\n\u003cp class=\"sec-intro\">Módulo 5 · Basic grammar. Só o que um iniciante precisa para formar frases como as do texto do Marc, no português do Brasil.\u003cspan class=\"tr\">Only what a beginner needs to build sentences like those in Marc's text, in Brazilian Portuguese.\u003c/span>\u003c/p>\n\n\u003ch2>1. Pronomes\u003cspan class=\"tr\"> · Pronouns\u003c/span>\u003c/h2>\n\u003cdiv id=\"pron\">\u003c/div>\n\u003cdiv class=\"callout tip\">\n  \u003cb class=\"t\">Brasil: você, não tu\u003c/b>\n  \u003cp>In most of Brazil \u003cspan class=\"pt\">você\u003c/span> is the normal “you”, with the same verb form as \u003ci>ele/ela\u003c/i>: \u003cspan class=\"pt\">você mora\u003c/span>. In Portugal you hear \u003cspan class=\"pt\">tu moras\u003c/span> all the time. Some regions of Brazil, especially the South, also use \u003cspan class=\"pt\">tu\u003c/span>, usually with the \u003ci>você\u003c/i> verb form (“tu mora”). Learn \u003cb>você\u003c/b> first. In everyday speech, \u003cspan class=\"pt\">a gente\u003c/span> = “we” and takes the \u003ci>ele\u003c/i> form: \u003cspan class=\"pt\">a gente mora\u003c/span>.\u003c/p>\n\u003c/div>\n\n\u003ch2>2. Ser e estar\u003cspan class=\"tr\"> · Ser and estar (to be)\u003c/span>\u003c/h2>\n\u003cp>Both mean “to be”. German also has only one verb (“sein”), so this needs attention.\u003c/p>\n\u003cdiv class=\"grid g2\">\n  \u003cdiv class=\"card\">\u003ch3>SER\u003c/h3>\u003cdiv id=\"serTbl\">\u003c/div>\u003cul style=\"margin:8px 0 0;padding-left:1.1em\">\u003cli>identity: \u003cspan class=\"pt\">Eu sou o Marc.\u003c/span>\u003cspan class=\"tr\"> (I am Marc.)\u003c/span>\u003c/li>\u003cli>origin / nationality: \u003cspan class=\"pt\">Sou alemão.\u003c/span>\u003cspan class=\"tr\"> (I am German.)\u003c/span>\u003c/li>\u003cli>profession, characteristics: \u003cspan class=\"pt\">Ela é simpática.\u003c/span>\u003cspan class=\"tr\"> (She is nice.)\u003c/span>\u003c/li>\u003cli>date and time: \u003cspan class=\"pt\">Hoje é quarta-feira.\u003c/span>\u003cspan class=\"tr\"> (Today is Wednesday.)\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3>ESTAR\u003c/h3>\u003cdiv id=\"estarTbl\">\u003c/div>\u003cul style=\"margin:8px 0 0;padding-left:1.1em\">\u003cli>location: \u003cspan class=\"pt\">Estou em Portugal.\u003c/span>\u003cspan class=\"tr\"> (I am in Portugal.)\u003c/span>\u003c/li>\u003cli>temporary state, feeling: \u003cspan class=\"pt\">Estou cansado.\u003c/span>\u003cspan class=\"tr\"> (I am tired.)\u003c/span>\u003c/li>\u003cli>action in progress: \u003cspan class=\"pt\">Estou estudando.\u003c/span>\u003cspan class=\"tr\"> (I am studying.)\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"callout de\">\n  \u003cb class=\"t\">🇩🇪 Brazil says “estou estudando”\u003c/b>\n  \u003cp>For “I am studying” Brazilians use \u003cb>estar + -ando\u003c/b> (\u003cspan class=\"pt\">estou estudando\u003c/span>). In Portugal it is \u003cspan class=\"pt\">estou a estudar\u003c/span>. See \u003ca href=\"07-brasil-x-portugal.html\">Brasil × Portugal\u003c/a>.\u003c/p>\n\u003c/div>\n\u003cp>Choose the right form.\u003c/p>\n\u003cdiv id=\"clSer\">\u003c/div>\n\n\u003ch2>3. Verbos do dia a dia\u003cspan class=\"tr\"> · Everyday verbs\u003c/span>\u003c/h2>\n\u003cp>Pick a verb. In Brazil you only need four forms in the present: \u003cb>eu · você/ele/ela/a gente · nós · vocês/eles/elas\u003c/b>.\u003c/p>\n\u003cdiv class=\"tool\">\n  \u003cdiv class=\"row\">\u003clabel for=\"verbSel\">Verbo\u003c/label>\u003cselect id=\"verbSel\">\u003c/select>\u003cspan id=\"verbMeaning\" class=\"muted\">\u003c/span>\u003c/div>\n  \u003cdiv id=\"verbTbl\">\u003c/div>\n\u003c/div>\n\u003ch3>Os três grupos regulares\u003cspan class=\"tr\"> · The three regular groups\u003c/span>\u003c/h3>\n\u003cdiv id=\"regular\">\u003c/div>\n\u003cdiv id=\"qVerbs\">\u003c/div>\n\n\u003ch2>4. Artigos, gênero e plural\u003cspan class=\"tr\"> · Articles, gender and plural\u003c/span>\u003c/h2>\n\u003cdiv class=\"grid g2\">\n  \u003cdiv class=\"card\">\u003ch3>Artigos\u003cspan class=\"tr\"> · Articles\u003c/span>\u003c/h3>\u003cdiv id=\"art\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3>Plural\u003c/h3>\u003cdiv id=\"plural\">\u003c/div>\u003c/div>\n\u003c/div>\n\u003ch3>Nacionalidades\u003cspan class=\"tr\"> · Nationalities\u003c/span>\u003c/h3>\n\u003cdiv id=\"nat\">\u003c/div>\n\u003cdiv id=\"qGender\">\u003c/div>\n\n\u003ch2>5. Países e contrações\u003cspan class=\"tr\"> · Countries and contractions\u003c/span>\u003c/h2>\n\u003cp>With countries you will say \u003cspan class=\"pt\">no Brasil\u003c/span>, \u003cspan class=\"pt\">na Alemanha\u003c/span>, \u003cspan class=\"pt\">em Portugal\u003c/span>. The preposition and the article merge.\u003c/p>\n\u003cdiv id=\"countries\">\u003c/div>\n\u003cdiv id=\"contr\">\u003c/div>\n\u003cdiv id=\"clContr\">\u003c/div>\n\n\u003ch2>6. Palavras interrogativas\u003cspan class=\"tr\"> · Question words\u003c/span>\u003c/h2>\n\u003cdiv id=\"qw\">\u003c/div>\n\u003cdiv id=\"mQw\">\u003c/div>\n\u003cdiv class=\"callout warn\">\n  \u003cb class=\"t\">por que × porque\u003c/b>\n  \u003cp>\u003cspan class=\"pt\">Por que você quer morar no Brasil?\u003c/span> (question, two words) · \u003cspan class=\"pt\">Porque eu gosto do país.\u003c/span> (answer, one word).\u003c/p>\n\u003c/div>\n\n\u003ch2>7. Negação\u003cspan class=\"tr\"> · Negation\u003c/span>\u003c/h2>\n\u003cp>Put \u003cb>não\u003c/b> before the verb. “Not yet” is \u003cb>ainda não\u003c/b>.\u003c/p>\n\u003cdiv id=\"neg\">\u003c/div>\n\n\u003cdiv class=\"callout prof\">\n  \u003cb class=\"t\">Para a professora\u003cspan class=\"tr\"> · For the teacher\u003c/span>\u003c/b>\n  \u003cp>Ordem sugerida: pronomes → ser/estar → ter e morar/falar/gostar → artigos e contrações → perguntas. Use o texto do Marc como fonte de frases reais. Evite tabelas com \u003ci>tu\u003c/i> e \u003ci>vós\u003c/i> neste nível. Erros prováveis: dizer “eu sou 48 anos” (alemão: “ich bin 48”), omitir o artigo (“moro Brasil”), usar “gostar” sem “de”, e “eu quero para aprender”.\u003c/p>\n  \u003cp class=\"tr\">Suggested order: pronouns → ser/estar → ter and morar/falar/gostar → articles and contractions → questions. Use Marc’s text as a source of real sentences. Avoid tables with tu and vós at this level. Likely errors: saying “eu sou 48 anos” (German: “ich bin 48”), omitting the article (“moro Brasil”), using “gostar” without “de”, and “eu quero para aprender”.\u003c/p>\n\u003c/div>\n\n\u003cbutton type=\"button\" class=\"btn complete\" data-complete>Marcar módulo como concluído\u003c/button>\n\n\u003cscript>\n(function(){\nvar G = window.G, U = G.UI;\nU.table(G.$('#pron'), ['Português','English','Exemplo','Ouvir'], [\n ['\u003cb>eu\u003c/b>','I','Eu moro em Portugal.'+G.trB('I live in Portugal.'),U.say('Eu moro em Portugal.')],\n ['\u003cb>você\u003c/b>','you','Você mora no Brasil?'+G.trB('Do you live in Brazil?'),U.say('Você mora no Brasil?')],\n ['\u003cb>ele / ela\u003c/b>','he / she','Ela é brasileira.'+G.trB('She is Brazilian.'),U.say('Ela é brasileira.')],\n ['\u003cb>a gente\u003c/b>','we (informal)','A gente mora aqui.'+G.trB('We live here.'),U.say('A gente mora aqui.')],\n ['\u003cb>nós\u003c/b>','we','Nós moramos aqui.'+G.trB('We live here.'),U.say('Nós moramos aqui.')],\n ['\u003cb>vocês\u003c/b>','you (plural)','Vocês moram aqui?'+G.trB('Do you (pl.) live here?'),U.say('Vocês moram aqui?')],\n ['\u003cb>eles / elas\u003c/b>','they','Eles são alemães.'+G.trB('They are German.'),U.say('Eles são alemães.')],\n ['\u003cb>o senhor / a senhora\u003c/b>','you (formal)','A senhora é de onde?'+G.trB('Where are you from, madam?'),U.say('A senhora é de onde?')]\n]);\n\nfunction conj(el, rows){ U.table(el, ['','Forma',''], rows.map(function(r){ return [r[0],'\u003cb class=\"pt\">'+r[1]+'\u003c/b>',U.say(r[0]+' '+r[1])]; })); }\nconj(G.$('#serTbl'), [['eu','sou'],['você / ele / ela / a gente','é'],['nós','somos'],['vocês / eles / elas','são']]);\nconj(G.$('#estarTbl'), [['eu','estou'],['você / ele / ela / a gente','está'],['nós','estamos'],['vocês / eles / elas','estão']]);\nG.Cloze.mount(G.$('#clSer'), { items:[\n {t:'Eu [[sou]] alemão.', choices:['sou','estou','é','está'], en:'I am German.'},\n {t:'Eu [[estou]] em Portugal.', choices:['sou','estou','é','está'], en:'I am in Portugal.'},\n {t:'Ela [[é]] brasileira.', choices:['é','está','sou','estou'], en:'She is Brazilian.'},\n {t:'Hoje [[é]] quarta-feira.', choices:['é','está','são','estão'], en:'Today is Wednesday.'},\n {t:'Nós [[estamos]] em casa.', choices:['somos','estamos','são','estão'], en:'We are at home.'},\n {t:'Vocês [[são]] de onde?', choices:['são','estão','é','está'], en:'Where are you (pl.) from?'},\n {t:'Eu [[estou]] cansado hoje.', choices:['sou','estou','é','está'], en:'I am tired today.'}\n]});\n\n/* verb conjugator */\nvar VB = {\n 'ser':['sou','é','somos','são','to be'],'estar':['estou','está','estamos','estão','to be (state/place)'],\n 'ter':['tenho','tem','temos','têm','to have'],'ir':['vou','vai','vamos','vão','to go'],\n 'querer':['quero','quer','queremos','querem','to want'],'morar':['moro','mora','moramos','moram','to live (reside)'],\n 'falar':['falo','fala','falamos','falam','to speak'],'gostar (de)':['gosto','gosta','gostamos','gostam','to like'],\n 'fazer':['faço','faz','fazemos','fazem','to do / make'],'poder':['posso','pode','podemos','podem','can / to be able'],\n 'viajar':['viajo','viaja','viajamos','viajam','to travel'],'aprender':['aprendo','aprende','aprendemos','aprendem','to learn']\n};\nvar vs = G.$('#verbSel'); vs.innerHTML = Object.keys(VB).map(function(k){ return '\u003coption>'+k+'\u003c/option>'; }).join('');\nfunction drawVerb(){ var k = vs.value, f = VB[k]; G.$('#verbMeaning').textContent = '= ' + f[4];\n  var ex = {'ser':'Eu sou alemão.','estar':'Eu estou aqui.','ter':'Eu tenho 48 anos.','ir':'Eu vou ao Brasil.','querer':'Eu quero aprender.','morar':'Eu moro em Portugal.','falar':'Eu falo inglês.','gostar (de)':'Eu gosto de viajar.','fazer':'Eu faço aula.','poder':'Eu posso ajudar.','viajar':'Eu viajo muito.','aprender':'Eu aprendo português.'}[k];\n  var exE = {'ser':'I am German.','estar':'I am here.','ter':'I am 48 years old.','ir':'I am going to Brazil.','querer':'I want to learn.','morar':'I live in Portugal.','falar':'I speak English.','gostar (de)':'I like to travel.','fazer':'I take a class.','poder':'I can help.','viajar':'I travel a lot.','aprender':'I learn Portuguese.'}[k];\n  conj(G.$('#verbTbl'), [['eu',f[0]],['você / ele / ela / a gente',f[1]],['nós',f[2]],['vocês / eles / elas',f[3]]]);\n  G.$('#verbTbl').insertAdjacentHTML('beforeend','\u003cp style=\"margin:0\">\u003cb>Exemplo:\u003c/b>'+G.tr('Example')+' \u003cspan class=\"pt\">'+ex+'\u003c/span> '+U.both(ex)+G.trB(exE)+'\u003c/p>'); }\nvs.addEventListener('change', drawVerb); drawVerb();\n\nU.table(G.$('#regular'), ['','-AR falar','-ER aprender','-IR partir'], [\n ['eu','falo','aprendo','parto'],['você / ele / ela','fala','aprende','parte'],['nós','falamos','aprendemos','partimos'],['vocês / eles','falam','aprendem','partem']\n].map(function(r,i){ return i===0?r:r; }));\nvar qv = [];\n['morar','falar','gostar (de)','querer','ter','ir','ser','estar','fazer','poder'].forEach(function(v){\n  var f = VB[v];\n  qv.push({type:'type', q:'\u003cb>'+v.replace(' (de)','')+'\u003c/b> · \u003ci>eu\u003c/i> →', answer:f[0], placeholder:'eu…'});\n  qv.push({type:'type', q:'\u003cb>'+v.replace(' (de)','')+'\u003c/b> · \u003ci>nós\u003c/i> →', answer:f[2], placeholder:'nós…'});\n  qv.push({type:'type', q:'\u003cb>'+v.replace(' (de)','')+'\u003c/b> · \u003ci>vocês\u003c/i> →', answer:f[3], placeholder:'vocês…'});\n});\nG.Quiz.mount(G.$('#qVerbs'), { id:'verbos', questions:qv, limit:8 });\n\n/* articles & plural */\nU.table(G.$('#art'), ['','m.','f.'], [['the (sg.)','\u003cb>o\u003c/b> livro','\u003cb>a\u003c/b> casa'],['the (pl.)','\u003cb>os\u003c/b> livros','\u003cb>as\u003c/b> casas'],['a (sg.)','\u003cb>um\u003c/b> livro','\u003cb>uma\u003c/b> casa'],['some (pl.)','\u003cb>uns\u003c/b> livros','\u003cb>umas\u003c/b> casas']]);\nU.table(G.$('#plural'), ['Ending','Plural','Example'], [\n ['vowel','+ s','casa → casas'],['r, z','+ es','mulher → mulheres'],['ão','ões · ães · ãos','limão → limões · pão → pães · mão → mãos'],['m','ns','homem → homens'],['l','is','animal → animais']\n]);\nU.table(G.$('#nat'), ['País','Masculino','Feminino','Ouvir'], [\n ['Alemanha'+G.trB('Germany'),'alemão','alemã',U.say('alemão, alemã')],\n ['Brasil'+G.trB('Brazil'),'brasileiro','brasileira',U.say('brasileiro, brasileira')],\n ['Portugal'+G.trB('Portugal'),'português','portuguesa',U.say('português, portuguesa')],\n ['Vietnã'+G.trB('Vietnam'),'vietnamita','vietnamita',U.say('vietnamita')],\n ['Malásia'+G.trB('Malaysia'),'malaio','malaia',U.say('malaio, malaia')],\n ['Inglaterra'+G.trB('England'),'inglês','inglesa',U.say('inglês, inglesa')],\n ['França'+G.trB('France'),'francês','francesa',U.say('francês, francesa')]\n]);\nG.Quiz.mount(G.$('#qGender'), { id:'genero', shuffle:true, questions:[\n {q:'\u003cb>__ casa\u003c/b> (the house)', options:['o','a','os'], answer:1, keepOrder:true},\n {q:'\u003cb>__ problema\u003c/b> (the problem)', options:['o','a','as'], answer:0, keepOrder:true, why:'Words in \u003ci>-ma\u003c/i> from Greek are masculine: o problema, o tema.'},\n {q:'\u003cb>__ mão\u003c/b> (the hand)', options:['o','a','os'], answer:1, keepOrder:true, why:'\u003ci>A mão\u003c/i> is feminine, plural \u003ci>as mãos\u003c/i>.'},\n {q:'Plural of \u003cb>pão\u003c/b>:', options:['pãos','pões','pães'], answer:2, keepOrder:true},\n {q:'Plural of \u003cb>animal\u003c/b>:', options:['animals','animais','animales'], answer:1, keepOrder:true},\n {q:'A woman from Germany is…', options:['alemão','alemã','alemana'], answer:1, keepOrder:true},\n {q:'\u003cb>Eu sou ___\u003c/b> (a man from Brazil)', options:['brasileira','brasileiro','brasileiros'], answer:1, keepOrder:true}\n]});\n\n/* countries and contractions */\nU.table(G.$('#countries'), ['País','Artigo','de / from','em / in','Ouvir'], [\n ['Alemanha'+G.trB('Germany'),'a','\u003cb>da\u003c/b> Alemanha','\u003cb>na\u003c/b> Alemanha',U.say('Eu sou da Alemanha. Moro na Alemanha.')],\n ['Brasil'+G.trB('Brazil'),'o','\u003cb>do\u003c/b> Brasil','\u003cb>no\u003c/b> Brasil',U.say('Eu sou do Brasil. Moro no Brasil.')],\n ['Portugal','—','\u003cb>de\u003c/b> Portugal','\u003cb>em\u003c/b> Portugal',U.say('Eu sou de Portugal. Moro em Portugal.')],\n ['Vietnã'+G.trB('Vietnam'),'o','\u003cb>do\u003c/b> Vietnã','\u003cb>no\u003c/b> Vietnã',U.say('Eu sou do Vietnã. Moro no Vietnã.')],\n ['Malásia'+G.trB('Malaysia'),'a','\u003cb>da\u003c/b> Malásia','\u003cb>na\u003c/b> Malásia',U.say('Eu sou da Malásia. Moro na Malásia.')],\n ['Ásia'+G.trB('Asia'),'a','\u003cb>da\u003c/b> Ásia','\u003cb>na\u003c/b> Ásia',U.say('Eu sou da Ásia. Moro na Ásia.')],\n ['Estados Unidos'+G.trB('United States'),'os','\u003cb>dos\u003c/b> Estados Unidos','\u003cb>nos\u003c/b> Estados Unidos',U.say('Eu sou dos Estados Unidos. Moro nos Estados Unidos.')]\n]);\nU.table(G.$('#contr'), ['Preposition','+ o / os','+ a / as','+ um / uma'], [\n ['de (of, from)','do / dos','da / das','dum / duma'],['em (in, on)','no / nos','na / nas','num / numa'],['a (to)','ao / aos','à / às','—'],['por (by, through)','pelo / pelos','pela / pelas','—']\n]);\nG.Cloze.mount(G.$('#clContr'), { items:[\n {t:'Eu moro [[no]] Brasil.', choices:['no','na','em','nos'], en:'I live in Brazil.'},\n {t:'Ela é [[da]] Alemanha.', choices:['do','da','de','das'], en:'She is from Germany.'},\n {t:'Morei [[na]] Malásia.', choices:['no','na','em','nas'], en:'I lived in Malaysia.'},\n {t:'Vou [[ao]] mercado. (a + o)', choices:['ao','à','no','do'], en:'I go to the market.'},\n {t:'Eu sou [[de]] Portugal.', choices:['do','da','de','no'], en:'I am from Portugal.'}\n]});\n\n/* question words */\nvar QW = [['Quem?','Who?','Quem é você?','Who are you?'],['O que?','What?','O que você faz?','What do you do?'],['Onde?','Where?','Onde você mora?','Where do you live?'],['Quando?','When?','Quando você vai?','When are you going?'],['Como?','How?','Como você se chama?','What is your name?'],['Por que?','Why?','Por que você quer morar no Brasil?','Why do you want to live in Brazil?'],['Qual / Quais?','Which?','Qual é o seu nome?','What is your name?'],['Quanto?','How much / many?','Quantos anos você tem?','How old are you?']];\nU.table(G.$('#qw'), ['Português','English','Exemplo','Ouvir'], QW.map(function(q){ return ['\u003cb>'+q[0]+'\u003c/b>',q[1],'\u003cspan class=\"pt\">'+q[2]+'\u003c/span>'+G.trB(q[3]),U.both(q[2])]; }));\nG.Match.mount(G.$('#mQw'), { pairs:[['Onde você mora?'+G.trB('Where do you live?'),'Em Portugal.'+G.trB('In Portugal.')],['Quantos anos você tem?'+G.trB('How old are you?'),'Quarenta e oito.'+G.trB('Forty-eight.')],['De onde você é?'+G.trB('Where are you from?'),'Da Alemanha.'+G.trB('From Germany.')],['Quando você vai?'+G.trB('When are you going?'),'Em dezembro.'+G.trB('In December.')],['Por que você estuda português?'+G.trB('Why do you study Portuguese?'),'Porque quero morar no Brasil.'+G.trB('Because I want to live in Brazil.')]], title:'Match question and answer' });\n\nU.table(G.$('#neg'), ['Português','English','Ouvir'], [\n ['\u003cspan class=\"pt\">Eu não falo português muito bem.\u003c/span>','I do not speak Portuguese very well.',U.both('Eu não falo português muito bem.')],\n ['\u003cspan class=\"pt\">Eu ainda não moro no Brasil.\u003c/span>','I do not live in Brazil yet.',U.both('Eu ainda não moro no Brasil.')],\n ['\u003cspan class=\"pt\">Não, obrigado.\u003c/span>','No, thank you.',U.both('Não, obrigado.')],\n ['\u003cspan class=\"pt\">Eu não entendi nada.\u003c/span>','I did not understand anything. (double negative is normal)',U.both('Eu não entendi nada.')],\n ['\u003cspan class=\"pt\">Eu nunca fui ao Brasil.\u003c/span>','I have never been to Brazil.',U.both('Eu nunca fui ao Brasil.')]\n]);\n})();\n\u003c/script>\n"},"06-numeros-e-tempo.html":{"id":"numeros","title":"Números e tempo","body":"\u003ch1>Números e tempo\u003cspan class=\"tr\">Numbers and time\u003c/span>\u003c/h1>\n\u003cp class=\"sec-intro\">Módulo 6 · Numbers, age, dates, time and money. Tudo o que o Marc precisa para dizer a idade, o ano em que nasceu, a data de hoje, as horas e os preços.\u003cspan class=\"tr\">Everything Marc needs to say his age, birth year, today's date, the time and prices.\u003c/span>\u003c/p>\n\n\u003ch2>1. De zero a vinte\u003cspan class=\"tr\"> · From zero to twenty\u003c/span>\u003c/h2>\n\u003cdiv id=\"n20\">\u003c/div>\n\u003cdiv class=\"callout tip\">\n  \u003cb class=\"t\">Spelling in Brazil\u003c/b>\n  \u003cp>16, 17 and 19 are \u003cspan class=\"pt\">dezesseis, dezessete, dezenove\u003c/span> in Brazil (\u003ci>dezasseis, dezassete, dezanove\u003c/i> in Portugal). 14 can be \u003cspan class=\"pt\">catorze\u003c/span> or \u003cspan class=\"pt\">quatorze\u003c/span>. And \u003cb>1 and 2\u003c/b> change with gender: \u003cspan class=\"pt\">um / uma\u003c/span>, \u003cspan class=\"pt\">dois / duas\u003c/span>.\u003c/p>\n\u003c/div>\n\n\u003ch2>2. Dezenas e centenas\u003cspan class=\"tr\"> · Tens and hundreds\u003c/span>\u003c/h2>\n\u003cdiv id=\"tens\">\u003c/div>\n\u003cp>Join tens and units with \u003cb>e\u003c/b>: \u003cspan class=\"pt\">quarenta e oito\u003c/span> (48) \u003cspan id=\"age48\">\u003c/span>\u003c/p>\n\n\u003ch2>3. Gerador de números\u003cspan class=\"tr\"> · Number generator\u003c/span>\u003c/h2>\n\u003cp>Type any number from 0 to 999 999 and hear it in Portuguese.\u003c/p>\n\u003cdiv class=\"tool\">\n  \u003cdiv class=\"row\">\u003cinput type=\"number\" id=\"numIn\" value=\"1977\" min=\"0\" max=\"999999\" aria-label=\"Número\">\u003cbutton type=\"button\" class=\"btn pri\" id=\"numGo\">Ver por extenso\u003cspan class=\"tr\"> · Show in words\u003c/span>\u003c/button>\u003c/div>\n  \u003cdiv id=\"numOut\" class=\"big-say\">\u003c/div>\n\u003c/div>\n\u003cdiv class=\"grid g3\">\n  \u003cdiv class=\"card\">\u003ch3>Idade\u003cspan class=\"tr\"> · Age\u003c/span>\u003c/h3>\u003cp class=\"pt\">Eu tenho quarenta e oito anos.\u003c/p>\u003cp class=\"tr\">I am forty-eight years old.\u003c/p>\u003cp>“Quantos anos você tem?”\u003cspan class=\"tr\"> (How old are you?)\u003c/span>\u003c/p>\u003cp style=\"margin:0\">\u003cspan id=\"s1\">\u003c/span>\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3>Ano de nascimento\u003cspan class=\"tr\"> · Year of birth\u003c/span>\u003c/h3>\u003cp class=\"pt\">Nasci em mil novecentos e setenta e sete.\u003c/p>\u003cp class=\"tr\">I was born in 1977.\u003c/p>\u003cp style=\"margin:0\">\u003cspan id=\"s2\">\u003c/span>\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3>Este ano\u003cspan class=\"tr\"> · This year\u003c/span>\u003c/h3>\u003cp class=\"pt\">Estamos em dois mil e vinte e seis.\u003c/p>\u003cp class=\"tr\">It is 2026.\u003c/p>\u003cp style=\"margin:0\">\u003cspan id=\"s3\">\u003c/span>\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"callout de\">\n  \u003cb class=\"t\">🇩🇪 Anos: kein “neunzehnhundert”\u003c/b>\n  \u003cp>Portuguese says \u003cspan class=\"pt\">mil novecentos e setenta e sete\u003c/span> (1000 + 900 + 77), not “nineteen seventy-seven”. After \u003ci>mil\u003c/i> the \u003cb>e\u003c/b> appears only before a number below 100 or a round hundred: \u003cspan class=\"pt\">dois mil e vinte e seis\u003c/span> but \u003cspan class=\"pt\">mil novecentos e setenta e sete\u003c/span>.\u003c/p>\n\u003c/div>\n\n\u003ch3>Praticar números\u003cspan class=\"tr\"> · Practice numbers\u003c/span>\u003c/h3>\n\u003cdiv id=\"qNumListen\">\u003c/div>\n\u003cdiv id=\"qNumWrite\">\u003c/div>\n\u003cdiv id=\"qYears\">\u003c/div>\n\n\u003ch2>4. Dias, meses e datas\u003cspan class=\"tr\"> · Days, months and dates\u003c/span>\u003c/h2>\n\u003cdiv class=\"card\" style=\"margin-bottom:12px\">\u003cb>Hoje:\u003c/b>\u003cspan class=\"tr\"> (Today)\u003c/span> \u003cspan class=\"pt\" id=\"todayTxt\">\u003c/span> \u003cspan id=\"todaySay\">\u003c/span>\u003cbr>\u003cspan class=\"tr\" id=\"todayEn\">\u003c/span>\u003c/div>\n\u003cdiv class=\"grid g2\">\n  \u003cdiv id=\"days\">\u003c/div>\n  \u003cdiv id=\"months\">\u003c/div>\n\u003c/div>\n\u003cdiv class=\"callout tip\">\n  \u003cb class=\"t\">Brasil: “segunda”, não “segunda-feira”\u003c/b>\n  \u003cp>In daily speech Brazilians shorten the weekdays: \u003cspan class=\"pt\">segunda, terça, quarta, quinta, sexta\u003c/span>. The first day of the month is \u003cspan class=\"pt\">primeiro\u003c/span> (1º de maio); the others use normal numbers: \u003cspan class=\"pt\">dois de maio\u003c/span>.\u003c/p>\n\u003c/div>\n\u003cdiv id=\"qDates\">\u003c/div>\n\n\u003ch2>5. Que horas são?\u003cspan class=\"tr\"> · What time is it?\u003c/span>\u003c/h2>\n\u003cdiv id=\"timeTbl\">\u003c/div>\n\u003cdiv id=\"qTime\">\u003c/div>\n\n\u003ch2>6. Dinheiro e preços\u003cspan class=\"tr\"> · Money and prices\u003c/span>\u003c/h2>\n\u003cdiv id=\"money\">\u003c/div>\n\u003cdiv class=\"tool\">\n  \u003cdiv class=\"row\">\u003clabel for=\"moneyIn\">Valor em R$\u003cspan class=\"tr\"> · Amount in R$\u003c/span>\u003c/label>\u003cinput type=\"number\" id=\"moneyIn\" value=\"12.50\" step=\"0.01\" min=\"0\" max=\"9999.99\">\u003cbutton type=\"button\" class=\"btn pri\" id=\"moneyGo\">Dizer o preço\u003cspan class=\"tr\"> · Say the price\u003c/span>\u003c/button>\u003c/div>\n  \u003cdiv id=\"moneyOut\" class=\"big-say\">\u003c/div>\n\u003c/div>\n\u003cdiv class=\"callout tip\">\n  \u003cb class=\"t\">Pix\u003c/b>\n  \u003cp>In Brazil almost everything can be paid with \u003cb>Pix\u003c/b>, an instant bank transfer made with a QR code or a “chave” (key). You will hear: \u003cspan class=\"pt\">“Aceita Pix?”\u003c/span> \u003cspan id=\"pixSay\">\u003c/span> It is one of the first things to set up when you live there.\u003c/p>\n\u003c/div>\n\u003cdiv id=\"qMoney\">\u003c/div>\n\n\u003cdiv class=\"callout prof\">\n  \u003cb class=\"t\">Para a professora\u003cspan class=\"tr\"> · For the teacher\u003c/span>\u003c/b>\n  \u003cp>Treine primeiro números de 0 a 20, depois dezenas, depois combinações (idade, anos, preços). Peça ao Marc para ditar o número de telefone e o ano de nascimento. Mostre que no Brasil se diz “zero” e que números de telefone costumam ser ditos dígito por dígito.\u003c/p>\n  \u003cp class=\"tr\">First practice numbers 0 to 20, then tens, then combinations (age, years, prices). Ask Marc to dictate his phone number and birth year. Point out that in Brazil people say “zero” and that phone numbers are usually said digit by digit.\u003c/p>\n\u003c/div>\n\n\u003cbutton type=\"button\" class=\"btn complete\" data-complete>Marcar módulo como concluído\u003c/button>\n\n\u003cscript>\n(function(){\nvar G = window.G, U = G.UI, PT = G.PT;\nvar rows = []; for(var i=0;i\u003c=20;i++){ rows.push(['\u003cb>'+i+'\u003c/b>','\u003cspan class=\"pt\">'+PT.num(i)+'\u003c/span>',U.both(PT.num(i))]); }\nvar half = Math.ceil(rows.length/2);\nG.$('#n20').innerHTML = '\u003cdiv class=\"grid g2\">\u003cdiv id=\"n20a\">\u003c/div>\u003cdiv id=\"n20b\">\u003c/div>\u003c/div>';\nU.table(G.$('#n20a'), ['#','Português','Ouvir'], rows.slice(0,half));\nU.table(G.$('#n20b'), ['#','Português','Ouvir'], rows.slice(half));\n\nvar tens = [];\n[20,30,40,50,60,70,80,90,100].forEach(function(n){ tens.push(['\u003cb>'+n+'\u003c/b>','\u003cspan class=\"pt\">'+PT.num(n)+'\u003c/span>',U.both(PT.num(n))]); });\n[200,300,400,500,600,700,800,900,1000].forEach(function(n){ tens.push(['\u003cb>'+n+'\u003c/b>','\u003cspan class=\"pt\">'+PT.num(n)+'\u003c/span>',U.both(PT.num(n))]); });\nG.$('#tens').innerHTML = '\u003cdiv class=\"grid g2\">\u003cdiv id=\"t1\">\u003c/div>\u003cdiv id=\"t2\">\u003c/div>\u003c/div>';\nU.table(G.$('#t1'), ['#','Português','Ouvir'], tens.slice(0,9));\nU.table(G.$('#t2'), ['#','Português','Ouvir'], tens.slice(9));\nG.$('#age48').innerHTML = U.both('quarenta e oito');\n\nfunction showNum(){\n  var n = parseInt(G.$('#numIn').value,10); if(isNaN(n)||n\u003c0||n>999999){ G.$('#numOut').textContent = 'Use um número de 0 a 999 999.'; return; }\n  var w = PT.num(n); G.$('#numOut').innerHTML = '\u003cspan class=\"pt\">'+w+'\u003c/span> '+U.both(w);\n}\nG.$('#numGo').addEventListener('click', showNum); G.$('#numIn').addEventListener('keydown', function(e){ if(e.key==='Enter') showNum(); });\nshowNum();\nG.$('#s1').innerHTML = U.both('Eu tenho quarenta e oito anos.');\nG.$('#s2').innerHTML = U.both('Nasci em mil novecentos e setenta e sete.');\nG.$('#s3').innerHTML = U.both('Estamos em dois mil e vinte e seis.');\n\n/* generated quizzes */\nfunction rnd(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }\nfunction distract(n, lo, hi){ var s = {}; s[n]=1; var out=[]; while(out.length\u003c3){ var d = Math.max(lo, Math.min(hi, n + rnd(-12,12))); if(d!==n && !s[d]){ s[d]=1; out.push(String(d)); } } return out; }\nvar q1 = []; for(var k=0;k\u003c10;k++){ var n = rnd(0,100); q1.push({q:'Listen: which number is it?', say:PT.num(n), options:[String(n)].concat(distract(n,0,100)), answer:0, why:'\u003cspan class=\"pt\">'+PT.num(n)+'\u003c/span> = '+n}); }\nG.Quiz.mount(G.$('#qNumListen'), { id:'numeros-ouvir', questions:q1 });\nvar q2 = []; for(var k2=0;k2\u003c8;k2++){ var m = rnd(0,99); q2.push({type:'type', q:'Write \u003cb>'+m+'\u003c/b> in words.', answer:PT.num(m)}); }\nG.Quiz.mount(G.$('#qNumWrite'), { id:'numeros-escrever', questions:q2, shuffle:false });\nvar q3 = []; [1977,1985,1999,2000,2010,2024,2026,1990].forEach(function(y){ q3.push({q:'Listen: which year?', say:PT.num(y), options:[String(y),String(y+1),String(y-10),String(y+10)], answer:0, why:'\u003cspan class=\"pt\">'+PT.num(y)+'\u003c/span>'}); });\nG.Quiz.mount(G.$('#qYears'), { id:'anos', questions:q3, limit:6 });\n\n/* dates */\nvar t = PT.today(); G.$('#todayTxt').textContent = t; G.$('#todaySay').innerHTML = U.both(t); G.$('#todayEn').textContent = PT.todayEn();\nvar dayAbbr = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];\nU.table(G.$('#days'), ['Dia','English','Ouvir'], [1,2,3,4,5,6,0].map(function(i){ return ['\u003cspan class=\"pt\">'+PT.DAYS[i]+'\u003c/span>',PT.DAYS_EN[i],U.say(PT.DAYS[i])]; }));\nU.table(G.$('#months'), ['Mês','English','Ouvir'], PT.MONTHS.map(function(m,i){ return ['\u003cspan class=\"pt\">'+m+'\u003c/span>',PT.MONTHS_EN[i],U.say(m)]; }));\nvar q4 = [\n {q:'The day after \u003cb>sexta-feira\u003c/b> is…', options:['sábado','domingo','quinta-feira'], answer:0, keepOrder:true},\n {q:'\u003cb>Março\u003c/b> is month number…', options:['2','3','4'], answer:1, keepOrder:true},\n {q:'Listen: which day is it?', say:'quarta-feira', options:['terça-feira','quarta-feira','quinta-feira'], answer:1, keepOrder:true},\n {q:'Listen: which month is it?', say:'outubro', options:['agosto','outubro','novembro'], answer:1, keepOrder:true},\n {q:'How do you say “1 May”?', options:['um de maio','primeiro de maio','uma de maio'], answer:1, keepOrder:true},\n {q:'Brazilians often shorten \u003cb>segunda-feira\u003c/b> to…', options:['segunda','segundo','seg-feira'], answer:0, keepOrder:true}\n];\nG.Quiz.mount(G.$('#qDates'), { id:'datas', questions:q4 });\n\n/* time */\nfunction hw(h){ return h===1?'uma':h===2?'duas':PT.num(h); }\nfunction timePhrase(h,m){\n  if(h===12&&m===0) return 'É meio-dia.'; if(h===0&&m===0) return 'É meia-noite.';\n  var hh = h%12===0?12:h%12; var base = hh===1 ? 'É uma' : 'São '+hw(hh);\n  if(m===0) return base+(hh===1?' hora.':' horas.');\n  if(m===30) return base+' e meia.';\n  return base+' e '+PT.num(m)+'.';\n}\nvar tt = [[8,0],[1,0],[2,15],[3,30],[6,45],[12,0],[9,10],[11,30]];\nfunction timeEn(h,m){ if(h===12&&m===0) return 'It is noon.'; if(h===0&&m===0) return 'It is midnight.'; var hh=h%12===0?12:h%12; if(m===0) return 'It is '+hh+\" o'clock.\"; if(m===15) return 'It is a quarter past '+hh+'.'; if(m===30) return 'It is half past '+hh+'.'; if(m===45) return 'It is a quarter to '+((hh%12)+1)+'.'; return 'It is '+hh+':'+(m\u003c10?'0':'')+m+'.'; }\nU.table(G.$('#timeTbl'), ['Hora','Português','English','Ouvir'], [[8,0],[1,0],[2,15],[3,30],[6,45],[12,0]].map(function(x){ var s = timePhrase(x[0],x[1]); return ['\u003cb>'+x[0]+':'+(x[1]\u003c10?'0':'')+x[1]+'\u003c/b>','\u003cspan class=\"pt\">'+s+'\u003c/span>',timeEn(x[0],x[1]),U.both(s)]; }));\nG.$('#timeTbl').insertAdjacentHTML('beforeend','\u003cp class=\"en\">Perguntar: \u003cspan class=\"pt\">Que horas são?\u003c/span> (What time is it?) '+U.both('Que horas são?')+' · \u003cspan class=\"pt\">Que horas é a aula?\u003c/span> (What time is the class?)\u003cbr>Brazilians also say: \u003cspan class=\"pt\">quinze para as três\u003c/span> (2:45) '+U.say('quinze para as três')+'\u003c/p>');\nvar q5 = []; tt.forEach(function(x){ var tm = function(a){ return a[0]+':'+(a[1]\u003c10?'0':'')+a[1]; };\n  var cand = [tm(x), tm([x[0], (x[1]+30)%60]), tm([(x[0]%12)+1, x[1]]), tm([x[0],15]), tm([x[0],45]), tm([x[0],0]), tm([x[0],30])];\n  var opts = cand.filter(function(c,i){ return cand.indexOf(c)===i; }).slice(0,4);\n  q5.push({q:'Listen: what time is it?', say:timePhrase(x[0],x[1]), options:opts, answer:0}); });\nG.Quiz.mount(G.$('#qTime'), { id:'horas', questions:q5, limit:6 });\n\n/* money */\nfunction moneyPhrase(v){\n  var r = Math.floor(v), c = Math.round((v - r)*100); if(c>=100){ r++; c=0; }\n  var rs = r===0 ? '' : PT.num(r)+(r===1?' real':' reais'), cs = c===0 ? '' : PT.num(c)+(c===1?' centavo':' centavos');\n  if(!rs && !cs) return 'zero reais'; return rs && cs ? rs+' e '+cs : rs||cs;\n}\nU.table(G.$('#money'), ['Português','English','Ouvir'], [\n ['\u003cspan class=\"pt\">Quanto custa?\u003c/span> / \u003cspan class=\"pt\">Quanto é?\u003c/span>','How much is it?',U.both('Quanto custa?')],\n ['\u003cspan class=\"pt\">É caro. / É barato.\u003c/span>','It is expensive. / It is cheap.',U.both('É caro. É barato.')],\n ['\u003cspan class=\"pt\">Aceita cartão?\u003c/span>','Do you accept cards?',U.both('Aceita cartão?')],\n ['\u003cspan class=\"pt\">Aceita Pix?\u003c/span>','Do you accept Pix?',U.both('Aceita Pix?')],\n ['\u003cspan class=\"pt\">Tem troco?\u003c/span>','Do you have change?',U.both('Tem troco?')],\n ['\u003cspan class=\"pt\">Posso pagar em dinheiro?\u003c/span>','Can I pay in cash?',U.both('Posso pagar em dinheiro?')],\n ['\u003cspan class=\"pt\">A conta, por favor.\u003c/span>','The bill, please.',U.both('A conta, por favor.')]\n]);\nfunction showMoney(){ var v = parseFloat(G.$('#moneyIn').value); if(isNaN(v)||v\u003c0){ G.$('#moneyOut').textContent=''; return; } var p = moneyPhrase(v); G.$('#moneyOut').innerHTML = '\u003cspan class=\"pt\">'+p+'\u003c/span> '+U.both(p); }\nG.$('#moneyGo').addEventListener('click', showMoney); showMoney();\nG.$('#pixSay').innerHTML = U.both('Aceita Pix?');\nvar q6 = []; [[5,0],[12,50],[30,0],[7,90],[100,0],[2,5]].forEach(function(x){ var v = x[0]+x[1]/100; var f = 'R$ '+x[0]+','+(x[1]\u003c10?'0':'')+x[1];\n  q6.push({q:'Listen: how much is it?', say:moneyPhrase(v), options:[f,'R$ '+(x[0]+10)+','+(x[1]\u003c10?'0':'')+x[1],'R$ '+Math.max(1,x[0]-1)+','+(x[1]\u003c10?'0':'')+x[1],'R$ '+x[0]+','+(x[1]===0?'50':'00')], answer:0}); });\nG.Quiz.mount(G.$('#qMoney'), { id:'dinheiro', questions:q6, limit:5 });\n})();\n\u003c/script>\n"},"07-brasil-x-portugal.html":{"id":"brasil","title":"Brasil × Portugal","body":"\u003ch1>Brasil × Portugal\u003cspan class=\"tr\">Brazil vs Portugal\u003c/span>\u003c/h1>\n\u003cp class=\"sec-intro\">Módulo 7 · Brazil vs Portugal. O Marc ouve português europeu todos os dias, mas quer falar como um brasileiro. Aqui estão as diferenças que mais importam.\u003cspan class=\"tr\">Marc hears European Portuguese every day but wants to speak like a Brazilian. Here are the differences that matter most.\u003c/span>\u003c/p>\n\n\u003cdiv class=\"callout\">\n  \u003cb class=\"t\">Same language, different music\u003c/b>\n  \u003cp>Brazilians and Portuguese understand each other, and your everyday contact with Portugal helps your vocabulary and reading. But in sound, a few rules are almost opposite. Buttons marked 🔊 play the \u003cb>Brazilian\u003c/b> voice, buttons marked 🇵🇹 play a \u003cb>European\u003c/b> voice \u003ci>if your device has one\u003c/i>.\u003c/p>\n\u003c/div>\n\n\u003ch2>1. Pronúncia\u003cspan class=\"tr\"> · Pronunciation\u003c/span>\u003c/h2>\n\u003cdiv id=\"pron\">\u003c/div>\n\u003cdiv class=\"callout de\">\n  \u003cb class=\"t\">🇩🇪 Your advantage and your trap\u003c/b>\n  \u003cp>\u003cb>Advantage:\u003c/b> the European “r” (\u003cspan class=\"ipa\">[ʁ]\u003c/span>, uvular) is exactly the German “r”, and a Brazilian initial R is close to German “ch” in “Bach” or even the same sound. \u003cb>Trap:\u003c/b> if you copy the European way of swallowing vowels, you will sound Portuguese. In Brazil keep every vowel \u003cb>clear and open\u003c/b>: \u003cspan class=\"pt\">telefone\u003c/span> = “te-le-fô-ni”, not “tlfón”.\u003c/p>\n\u003c/div>\n\u003cdiv id=\"qPron\">\u003c/div>\n\n\u003ch2>2. Gramática\u003cspan class=\"tr\"> · Grammar\u003c/span>\u003c/h2>\n\u003cdiv id=\"gram\">\u003c/div>\n\n\u003ch2>3. Vocabulário\u003cspan class=\"tr\"> · Vocabulary\u003c/span>\u003c/h2>\n\u003cp>Filter, listen, and notice the pairs you hear in Portugal every day.\u003c/p>\n\u003cdiv class=\"filters\" id=\"vf\" role=\"group\" aria-label=\"Filtrar vocabulário\">\u003c/div>\n\u003cdiv id=\"vocab\">\u003c/div>\n\n\u003cdiv class=\"callout warn\">\n  \u003cb class=\"t\">Cuidado: palavras com outro sentido\u003c/b>\n  \u003cdiv id=\"warn\">\u003c/div>\n\u003c/div>\n\n\u003ch3>Flashcards: palavras do Brasil\u003cspan class=\"tr\"> · Flashcards: Brazilian words\u003c/span>\u003c/h3>\n\u003cdiv id=\"fcBr\">\u003c/div>\n\u003cdiv id=\"mBr\">\u003c/div>\n\u003cdiv id=\"qBr\">\u003c/div>\n\n\u003ch2>4. Brasil é grande: sotaques\u003cspan class=\"tr\"> · Brazil is big: accents\u003c/span>\u003c/h2>\n\u003cdiv class=\"grid g3\" id=\"accents\">\u003c/div>\n\u003cp class=\"muted\">There is no single “correct” accent. A good starting target is the neutral accent heard in national news, then you learn other accents by ear.\u003c/p>\n\n\u003ch2>5. Vocabulário de vida prática no Brasil\u003cspan class=\"tr\"> · Practical-life vocabulary in Brazil\u003c/span>\u003c/h2>\n\u003cp>You will meet these in your first weeks after moving.\u003c/p>\n\u003cdiv id=\"life\">\u003c/div>\n\n\u003ch2>6. Treine o ouvido\u003cspan class=\"tr\"> · Train your ear\u003c/span>\u003c/h2>\n\u003cul>\n  \u003cli>Watch series, films and YouTube in \u003cb>Brazilian\u003c/b> Portuguese with Portuguese subtitles, and repeat short lines.\u003c/li>\n  \u003cli>Listen to Brazilian music (samba, bossa nova, MPB, sertanejo) and read the lyrics from a licensed lyrics site.\u003c/li>\n  \u003cli>Choose Brazilian podcasts and voice messages from Brazilian friends: real speed is faster and more connected.\u003c/li>\n  \u003cli>Record yourself reading Marc’s text from \u003ca href=\"04-apresentacao.html\">Apresentação\u003c/a> and compare it with the Brazilian audio.\u003c/li>\n\u003c/ul>\n\n\u003cdiv class=\"callout prof\">\n  \u003cb class=\"t\">Para a professora\u003cspan class=\"tr\"> · For the teacher\u003c/span>\u003c/b>\n  \u003cp>Combine com o Marc uma regra de ouro: \u003cb>“palavras do dia a dia do Brasil”\u003c/b>. Quando ele disser uma palavra de Portugal (autocarro, telemóvel), você apenas devolve a palavra brasileira, sem corrigir de forma pesada. Reforce o tema das “palavras perigosas” com humor. Pergunte em qual região do Brasil ele pretende morar para ajustar sotaque e gírias.\u003c/p>\n  \u003cp class=\"tr\">Agree on a golden rule with Marc: “everyday Brazilian words”. When he says a word from Portugal (autocarro, telemóvel), simply give back the Brazilian word without heavy correction. Reinforce the “dangerous words” topic with humor. Ask which region of Brazil he plans to live in to adjust accent and slang.\u003c/p>\n\u003c/div>\n\n\u003cbutton type=\"button\" class=\"btn complete\" data-complete>Marcar módulo como concluído\u003c/button>\n\n\u003cscript>\n(function(){\nvar G = window.G, U = G.UI;\nfunction bp(br, pt){ return U.say(br)+' '+U.say(pt||br,{lang:'pt-PT'}); }\n\nU.table(G.$('#pron'), ['Traço','🇧🇷 Brasil','🇵🇹 Portugal','Exemplo (🔊 BR · 🇵🇹 PT)'], [\n ['\u003cb>t / d before i\u003c/b>','\u003cspan class=\"ipa\">[ˈdʒiɐ]\u003c/span> “djia”','\u003cspan class=\"ipa\">[ˈdiɐ]\u003c/span> “dia”','\u003cspan class=\"pt\">dia, tia\u003c/span> '+bp('dia, tia')],\n ['\u003cb>final -e\u003c/b>','\u003cspan class=\"ipa\">[ˈlejtʃi]\u003c/span> “lêitchi”','\u003cspan class=\"ipa\">[ˈlɐjt]\u003c/span> (almost silent)','\u003cspan class=\"pt\">leite\u003c/span> '+bp('leite')],\n ['\u003cb>unstressed vowels\u003c/b>','clear: “pe-kê-nu”','swallowed: “p’kê-nu”','\u003cspan class=\"pt\">pequeno\u003c/span> '+bp('pequeno')],\n ['\u003cb>final L\u003c/b>','\u003cspan class=\"ipa\">[w]\u003c/span> “Brasiu”','\u003cspan class=\"ipa\">[ɫ]\u003c/span> dark “l”','\u003cspan class=\"pt\">Brasil\u003c/span> '+bp('Brasil')],\n ['\u003cb>initial R\u003c/b>','\u003cspan class=\"ipa\">[x ~ h]\u003c/span> airy “h/ch”','\u003cspan class=\"ipa\">[ʁ]\u003c/span> German “r”','\u003cspan class=\"pt\">rato, rua\u003c/span> '+bp('rato, rua')],\n ['\u003cb>final S\u003c/b>','\u003cspan class=\"ipa\">[s]\u003c/span> (Rio: [ʃ])','\u003cspan class=\"ipa\">[ʃ]\u003c/span> “sh”','\u003cspan class=\"pt\">mais, português\u003c/span> '+bp('mais, português')],\n ['\u003cb>rhythm\u003c/b>','even, vowel-rich (syllable-timed)','compressed, consonant-rich','\u003cspan class=\"pt\">Eu moro em Portugal.\u003c/span> '+G.trB('I live in Portugal.')+' '+bp('Eu moro em Portugal.')]\n]);\nG.Quiz.mount(G.$('#qPron'), { id:'pron-br-pt', shuffle:true, questions:[\n {q:'In Brazil, \u003cb>dia\u003c/b> sounds like…', options:['“dee-a” (as in Portugal)','“djia”'], answer:1, keepOrder:true},\n {q:'In Brazil, \u003cb>leite\u003c/b> ends with…', options:['an almost silent e','the sound “i”'], answer:1, keepOrder:true},\n {q:'Which pronunciation of \u003cb>Brasil\u003c/b> is typical in Brazil?', options:['“Brasiu”','“Brazil” with dark l'], answer:0, keepOrder:true},\n {q:'The European Portuguese “r” of \u003cb>rato\u003c/b> is like…', options:['the German “r”','the Spanish rolled “rr”','a silent r'], answer:0, keepOrder:true},\n {q:'Which feature makes Portuguese sound “compressed”?', options:['swallowed unstressed vowels','pronouncing every vowel','adding “i” after consonants'], answer:0, keepOrder:true}\n]});\n\nU.table(G.$('#gram'), ['','🇧🇷 Brasil','🇵🇹 Portugal'], [\n ['I am speaking','\u003cspan class=\"pt\">Estou \u003cb>falando\u003c/b> português.\u003c/span> '+U.say('Estou falando português.'),'\u003cspan class=\"pt\">Estou \u003cb>a falar\u003c/b> português.\u003c/span> '+U.say('Estou a falar português.',{lang:'pt-PT'})],\n ['you (everyday)','\u003cspan class=\"pt\">\u003cb>Você\u003c/b> mora aqui?\u003c/span> '+U.say('Você mora aqui?'),'\u003cspan class=\"pt\">\u003cb>Tu\u003c/b> moras aqui?\u003c/span> '+U.say('Tu moras aqui?',{lang:'pt-PT'})],\n ['My name is…','\u003cspan class=\"pt\">Eu \u003cb>me\u003c/b> chamo Marc.\u003c/span> '+U.say('Eu me chamo Marc.'),'\u003cspan class=\"pt\">Chamo-\u003cb>me\u003c/b> Marc.\u003c/span> '+U.say('Chamo-me Marc.',{lang:'pt-PT'})],\n ['I love you','\u003cspan class=\"pt\">Eu \u003cb>te\u003c/b> amo.\u003c/span> '+U.say('Eu te amo.'),'\u003cspan class=\"pt\">Amo-\u003cb>te\u003c/b>.\u003c/span> '+U.say('Amo-te.',{lang:'pt-PT'})],\n ['my car','\u003cspan class=\"pt\">\u003cb>Meu\u003c/b> carro é azul.\u003c/span> '+U.say('Meu carro é azul.'),'\u003cspan class=\"pt\">\u003cb>O meu\u003c/b> carro é azul.\u003c/span> '+U.say('O meu carro é azul.',{lang:'pt-PT'})],\n ['I arrived home','\u003cspan class=\"pt\">Cheguei \u003cb>em\u003c/b> casa.\u003c/span> '+U.say('Cheguei em casa.'),'\u003cspan class=\"pt\">Cheguei \u003cb>a\u003c/b> casa.\u003c/span> '+U.say('Cheguei a casa.',{lang:'pt-PT'})],\n ['we (everyday)','\u003cspan class=\"pt\">\u003cb>A gente\u003c/b> vai.\u003c/span> '+U.say('A gente vai.'),'\u003cspan class=\"pt\">\u003cb>Nós\u003c/b> vamos.\u003c/span> '+U.say('Nós vamos.',{lang:'pt-PT'})],\n ['Hi, how are you?','\u003cspan class=\"pt\">Oi, tudo bem?\u003c/span> '+U.say('Oi, tudo bem?'),'\u003cspan class=\"pt\">Olá, tudo bem? / Estás bom?\u003c/span> '+U.say('Olá, tudo bem?',{lang:'pt-PT'})]\n]);\n\n/* vocabulary: en, br, pt, cat, note */\nvar VOC = [\n ['bus','ônibus','autocarro','transporte',''],['train','trem','comboio','transporte',''],['bus stop','ponto de ônibus','paragem','transporte',''],\n ['to take the bus','pegar o ônibus','apanhar o autocarro','transporte','BR “apanhar” = get beaten!'],['ticket (transport)','passagem','bilhete','transporte',''],['sidewalk','calçada','passeio','cidade',''],\n ['cell phone','celular','telemóvel','casa',''],['screen','tela','ecrã','casa',''],['bathroom','banheiro','casa de banho','casa',''],['fridge','geladeira','frigorífico','casa',''],['shower','chuveiro','duche','casa',''],\n ['breakfast','café da manhã','pequeno-almoço','comida',''],['juice','suco','sumo','comida',''],['ice cream','sorvete','gelado','comida',''],['bakery / café','padaria','pastelaria','comida','In Brazil a \u003ci>padaria\u003c/i> sells bread, coffee and snacks.'],['espresso','cafezinho','bica','comida',''],['butcher','açougue','talho','comida',''],\n ['T-shirt','camiseta','t-shirt','roupa',''],['suit','terno','fato','roupa',''],['sock','meia','peúga','roupa',''],['pants','calça','calças','roupa',''],\n ['rent','aluguel','renda / aluguer','vida','For apartments: \u003ci>aluguel\u003c/i> (BR).'],['ATM','caixa eletrônico','multibanco','vida',''],['postal code','CEP','código postal','vida',''],['queue','fila','bicha','vida','BR “bicha” is offensive!'],\n ['cool / nice','legal','fixe','gíria','Also in BR: \u003ci>massa, show, beleza\u003c/i>.'],['very','muito','bué (slang)','gíria',''],['kid','criança / menino','miúdo / puto','gíria','BR “puto” is rude!']\n];\nvar cats = ['Todos','transporte','casa','comida','roupa','vida','cidade','gíria'], cur = 'Todos';\nfunction drawVoc(){\n  G.$('#vf').innerHTML = cats.map(function(c){ return '\u003cbutton type=\"button\" data-c=\"'+c+'\" aria-pressed=\"'+(c===cur)+'\">'+c+'\u003c/button>'; }).join('');\n  U.table(G.$('#vocab'), ['English','🇧🇷 Brasil','🇵🇹 Portugal','Nota'], VOC.filter(function(v){ return cur==='Todos'||v[3]===cur; }).map(function(v){ return [v[0],'\u003cspan class=\"pt\">'+v[1]+'\u003c/span> '+U.say(v[1]),'\u003cspan class=\"pt\">'+v[2]+'\u003c/span> '+U.say(v[2].split(' /')[0].replace(' (slang)',''),{lang:'pt-PT'}),v[4]]; }));\n}\nG.$('#vf').addEventListener('click', function(e){ var b = e.target.closest('button[data-c]'); if(!b) return; cur = b.getAttribute('data-c'); drawVoc(); });\ndrawVoc();\n\nvar W = [\n ['rapariga','PT: girl · BR: can sound offensive in parts of Brazil','Use \u003cb>menina\u003c/b> / \u003cb>moça\u003c/b>.'],\n ['bicha','PT: queue · BR: derogatory word for a gay man','Use \u003cb>fila\u003c/b>.'],\n ['puto','PT: kid · BR: rude, also “furious” (puto da vida)','Use \u003cb>menino\u003c/b> / \u003cb>garoto\u003c/b>.'],\n ['apanhar','PT: to catch (the bus) · BR: to get beaten up','Use \u003cb>pegar\u003c/b> (o ônibus).'],\n ['camisola','PT: sweater / jersey · BR: nightgown','Use \u003cb>blusa\u003c/b> / \u003cb>camiseta\u003c/b>.']\n];\nG.$('#warn').innerHTML = W.map(function(w){ return '\u003cdiv class=\"sentence\" style=\"border:0;padding:4px 0\">\u003cdiv class=\"tx\">\u003cb class=\"pt\">'+w[0]+'\u003c/b> — '+w[1]+'. '+w[2]+'\u003c/div>\u003c/div>'; }).join('');\n\nG.Cards.mount(G.$('#fcBr'), { id:'br-words', deck: VOC.slice(0,18).map(function(v){ return {f:'\u003cspan style=\"font-size:1.1rem\" class=\"en\">'+v[0]+'\u003c/span>', b:v[1], say:v[1], n:'Portugal: '+v[2]}; }) });\nG.Match.mount(G.$('#mBr'), { title:'Match English with the Brazilian word', sayLeft:false, pairs:[['bus','ônibus'],['cell phone','celular'],['bathroom','banheiro'],['juice','suco'],['fridge','geladeira'],['sidewalk','calçada']] });\nvar qb = [];\nVOC.forEach(function(v){ var brWord = v[1].split(' /')[0], ptWord = v[2].split(' /')[0].replace(' (slang)','');\n  if(brWord.toLowerCase()!==ptWord.toLowerCase()){ var q = G.shuffle([[brWord,'Brasil'],[ptWord,'Portugal']])[0]; qb.push({q:'\u003cb>'+q[0]+'\u003c/b>: Brazil or Portugal?', options:['Brasil','Portugal'], answer:q[1]==='Brasil'?0:1, keepOrder:true, why:'🇧🇷 '+brWord+' · 🇵🇹 '+ptWord}); }\n});\nG.Quiz.mount(G.$('#qBr'), { id:'br-ou-pt', questions:qb, limit:8 });\n\nvar ACC = [\n ['São Paulo','paulistano','Clear “r” (h/x), final -s as [s], “meu” “mano”.'],\n ['Rio de Janeiro','carioca','Final -s as “sh”, melodic rhythm: “mermão”, “maneiro”.'],\n ['Minas Gerais','mineiro','Fast, swallowed endings: “uai”, “trem” (= thing).'],\n ['Rio Grande do Sul','gaúcho','Uses “tu”: “bah”, “tchê”, “tri” (very).'],\n ['Nordeste','nordestino','Open vowels, “oxente”, “massa”.'],\n ['Pará / Amazônia','paraense','Own vocabulary and melody: “égua”.']\n];\nG.$('#accents').innerHTML = ACC.map(function(a){ return '\u003cdiv class=\"card\">\u003ch3>'+a[0]+'\u003c/h3>\u003cp class=\"muted\" style=\"margin:0 0 6px\">'+a[1]+'\u003c/p>\u003cp style=\"margin:0\">'+a[2]+'\u003c/p>\u003c/div>'; }).join('');\n\nvar LIFE = [\n ['CPF','tax number needed for almost everything (bank, phone, shopping)'],['CEP','postal code'],['RG','ID card'],['aluguel','rent'],['condomínio','building fee (also “condo”)'],['mercado / supermercado','grocery store'],\n ['feira','street market for fruit and vegetables'],['padaria','bakery and breakfast spot'],['Pix','instant payment'],['parcelar','to pay in installments (“em 10 vezes”)'],['boleto','payment slip'],['plano de saúde','private health insurance'],['SUS','public health system'],['DDD','area code']\n];\nU.table(G.$('#life'), ['Palavra','English','Ouvir'], LIFE.map(function(l){ return ['\u003cb class=\"pt\">'+l[0]+'\u003c/b>',l[1],U.say(l[0].replace('CPF','cê pê éfe').replace('CEP','cê é pê').replace('RG','érre gê').replace('SUS','sus').replace('DDD','dê dê dê'))]; }));\n})();\n\u003c/script>\n"},"08-praticar.html":{"id":"praticar","title":"Praticar","body":"\u003ch1>Praticar\u003cspan class=\"tr\">Practice\u003c/span>\u003c/h1>\n\u003cp class=\"sec-intro\">Módulo 8 · Practice. Jogos de revisão para fazer em aula ou em casa. Tudo aqui mistura o que você aprendeu nos módulos anteriores.\u003cspan class=\"tr\">Review games for class or home. Everything here mixes what you learned in the earlier modules.\u003c/span>\u003c/p>\n\n\u003ch2>1. Frase do dia\u003cspan class=\"tr\"> · Sentence of the day\u003c/span>\u003c/h2>\n\u003cdiv class=\"tool\">\n  \u003cdiv id=\"fraseBox\">\u003c/div>\n  \u003cdiv class=\"row\">\u003cbutton type=\"button\" class=\"btn pri\" id=\"novaFrase\">Outra frase\u003cspan class=\"tr\"> · Another sentence\u003c/span>\u003c/button>\u003c/div>\n\u003c/div>\n\n\u003ch2>2. Flashcards: vocabulário essencial\u003cspan class=\"tr\"> · Flashcards: essential vocabulary\u003c/span>\u003c/h2>\n\u003cdiv id=\"fcAll\">\u003c/div>\n\n\u003ch2>3. Jogos de associação\u003cspan class=\"tr\"> · Matching games\u003c/span>\u003c/h2>\n\u003cdiv id=\"m1\">\u003c/div>\n\u003cdiv id=\"m2\">\u003c/div>\n\u003cdiv id=\"m3\">\u003c/div>\n\n\u003ch2>4. Ditado\u003cspan class=\"tr\"> · Dictation\u003c/span>\u003c/h2>\n\u003cp>Listen and type the whole sentence. Accents count, but a missing accent is only a small warning.\u003c/p>\n\u003cdiv id=\"dict\">\u003c/div>\n\n\u003ch2>5. Monte as frases\u003cspan class=\"tr\"> · Build the sentences\u003c/span>\u003c/h2>\n\u003cdiv id=\"ro\">\u003c/div>\n\n\u003ch2>6. Desafio de fala\u003cspan class=\"tr\"> · Speaking challenge\u003c/span>\u003c/h2>\n\u003cp>Read the sentence out loud (or press 🔊 first). In Chrome or Edge the 🎤 button tells you which words it understood.\u003c/p>\n\u003cdiv class=\"tool\" id=\"speakBox\">\u003c/div>\n\n\u003ch2>7. Revisão geral\u003cspan class=\"tr\"> · General review\u003c/span>\u003c/h2>\n\u003cdiv id=\"qAll\">\u003c/div>\n\n\u003cdiv class=\"callout prof\">\n  \u003cb class=\"t\">Para a professora\u003cspan class=\"tr\"> · For the teacher\u003c/span>\u003c/b>\n  \u003cp>Sugestão: abra a aula com 5 minutos de “Frase do dia” (o Marc repete e depois varia uma palavra), feche com o ditado ou com a revisão geral. Anote os itens que ele erra duas vezes e traga de volta na aula seguinte.\u003c/p>\n  \u003cp class=\"tr\">Suggestion: open the lesson with 5 minutes of “Sentence of the day” (Marc repeats, then changes one word), close with dictation or the general review. Note the items he gets wrong twice and bring them back next lesson.\u003c/p>\n\u003c/div>\n\n\u003cbutton type=\"button\" class=\"btn complete\" data-complete>Marcar módulo como concluído\u003c/button>\n\n\u003cscript>\n(function(){\nvar G = window.G, U = G.UI, PT = G.PT;\nvar F = [\n ['Eu moro em Portugal há dois anos.','I have lived in Portugal for two years.'],\n ['Eu quero aprender a falar português como um brasileiro.','I want to learn to speak Portuguese like a Brazilian.'],\n ['Tudo bem? Tudo ótimo, e você?','All good? Great, and you?'],\n ['Pode repetir, por favor? Mais devagar.','Can you repeat, please? Slower.'],\n ['Eu gosto de viajar e conhecer pessoas.','I like travelling and meeting people.'],\n ['Hoje eu estou muito bem.','Today I am very well.'],\n ['Onde fica o banheiro?','Where is the bathroom?'],\n ['Quanto custa? Aceita Pix?','How much is it? Do you accept Pix?'],\n ['Eu vou morar no Brasil com minha família.','I am going to live in Brazil with my family.'],\n ['Que horas são? São oito e meia.','What time is it? It is half past eight.']\n];\nvar fi = 0;\nfunction frase(){ var f = F[fi % F.length]; fi = (fi+1) % F.length; G.$('#fraseBox').innerHTML = '\u003cp class=\"big-say\" style=\"margin:0 0 4px\">'+f[0]+' '+U.both(f[0])+'\u003c/p>\u003cp class=\"en\" style=\"margin:0 0 8px\">'+f[1]+'\u003c/p>\u003cdiv class=\"listen\" id=\"lf\">\u003c/div>'; G.Listen.attach(G.$('#lf'), f[0]); }\nfi = Math.floor(Math.random()*F.length); frase();\nG.$('#novaFrase').addEventListener('click', frase);\n\nG.Cards.mount(G.$('#fcAll'), { id:'essencial', deck:[\n {f:'morar',b:'to live (reside)',say:'morar',n:'Eu moro em Portugal.'},\n {f:'viajar',b:'to travel',say:'viajar',n:'Eu gosto de viajar.'},\n {f:'querer',b:'to want',say:'querer',n:'Eu quero aprender.'},\n {f:'aprender',b:'to learn',say:'aprender'},\n {f:'falar',b:'to speak',say:'falar'},\n {f:'gostar de',b:'to like',say:'gostar de'},\n {f:'ficar',b:'to stay / to be located',say:'ficar'},\n {f:'ter',b:'to have',say:'ter',n:'Tenho 48 anos.'},\n {f:'ir',b:'to go',say:'ir'},\n {f:'vir',b:'to come',say:'vir'},\n {f:'entender',b:'to understand',say:'entender',n:'Eu não entendi.'},\n {f:'precisar de',b:'to need',say:'precisar de'},\n {f:'ajuda',b:'help',say:'ajuda',n:'Preciso de ajuda.'},\n {f:'casa',b:'house, home',say:'casa'},\n {f:'trabalho',b:'work, job',say:'trabalho'},\n {f:'amigo / amiga',b:'friend',say:'amigo, amiga'},\n {f:'família',b:'family',say:'família'},\n {f:'cidade',b:'city',say:'cidade'},\n {f:'país',b:'country',say:'país'},\n {f:'praia',b:'beach',say:'praia'},\n {f:'água',b:'water',say:'água'},\n {f:'comida',b:'food',say:'comida'},\n {f:'hoje',b:'today',say:'hoje'},\n {f:'amanhã',b:'tomorrow',say:'amanhã'},\n {f:'ontem',b:'yesterday',say:'ontem'},\n {f:'agora',b:'now',say:'agora'},\n {f:'muito',b:'very, a lot',say:'muito'},\n {f:'pouco',b:'a little',say:'pouco'},\n {f:'bom / boa',b:'good',say:'bom, boa'},\n {f:'grande',b:'big',say:'grande'},\n {f:'novo / nova',b:'new',say:'novo, nova'},\n {f:'saudade',b:'longing, missing someone or something',say:'saudade',n:'A famous Portuguese word: “Tenho saudade da Alemanha.”'}\n]});\n\nG.Match.mount(G.$('#m1'), { title:'Países e nacionalidades'+G.tr('Countries and nationalities'), pairs:[['Alemanha'+G.trB('Germany'),'alemão / alemã'],['Brasil'+G.trB('Brazil'),'brasileiro / brasileira'],['Portugal'+G.trB('Portugal'),'português / portuguesa'],['Vietnã'+G.trB('Vietnam'),'vietnamita'],['Malásia'+G.trB('Malaysia'),'malaio / malaia'],['França'+G.trB('France'),'francês / francesa']] });\nG.Match.mount(G.$('#m2'), { title:'Números'+G.tr('Numbers'), sayLeft:true, pairs:[['7','sete'],['13','treze'],['16','dezesseis'],['48','quarenta e oito'],['77','setenta e sete'],['100','cem']] });\nG.Match.mount(G.$('#m3'), { title:'Verbos: infinitivo e “eu”'+G.tr('Verbs: infinitive and “I”'), pairs:[['morar'+G.trB('to live'),'moro'],['ter'+G.trB('to have'),'tenho'],['ir'+G.trB('to go'),'vou'],['querer'+G.trB('to want'),'quero'],['fazer'+G.trB('to do'),'faço'],['estar'+G.trB('to be'),'estou']] });\n\nvar D = [\n 'Eu moro em Portugal.','Meu nome é Marc.','Eu sou da Alemanha.','Eu tenho quarenta e oito anos.','Eu quero morar no Brasil.','Tudo bem, e você?',\n 'Pode repetir, por favor?','Eu gosto de viajar.','Onde você mora?','Muito prazer.','Boa tarde, tudo bem?','Eu não entendi.'\n];\nvar DE = {'Eu moro em Portugal.':'I live in Portugal.','Meu nome é Marc.':'My name is Marc.','Eu sou da Alemanha.':'I am from Germany.','Eu tenho quarenta e oito anos.':'I am forty-eight years old.','Eu quero morar no Brasil.':'I want to live in Brazil.','Tudo bem, e você?':'Good, and you?','Pode repetir, por favor?':'Can you repeat, please?','Eu gosto de viajar.':'I like to travel.','Onde você mora?':'Where do you live?','Muito prazer.':'Nice to meet you.','Boa tarde, tudo bem?':'Good afternoon, how are you?','Eu não entendi.':'I did not understand.'};\nG.Quiz.mount(G.$('#dict'), { id:'ditado-frases', limit:6, questions: D.map(function(s){ return {type:'type', q:'Type the sentence you hear.', say:s, answer:s, why:'\u003cspan class=\"tr\">'+DE[s]+'\u003c/span>'}; }) });\n\nG.Reorder.mount(G.$('#ro'), [\n {pt:'Eu quero aprender português do Brasil.',en:'I want to learn Brazilian Portuguese.'},\n {pt:'Você mora em Portugal há dois anos?',en:'Have you lived in Portugal for two years?'},\n {pt:'Eu não falo muito bem ainda.',en:'I do not speak very well yet.'},\n {pt:'A gente vai morar no Brasil.',en:'We are going to live in Brazil.'},\n {pt:'Quanto custa o ônibus?',en:'How much is the bus?'}\n]);\n\nvar S = ['Eu moro em Portugal há dois anos.','Meu objetivo é morar no Brasil.','Eu gosto muito de viajar.','Prazer em conhecer você!','Tchau, até amanhã!','O rato roeu a roupa do rei de Roma.','Três pratos de trigo para três tigres tristes.','Eu moro no Brasil.'];\nvar SE = {'Eu moro em Portugal há dois anos.':'I have lived in Portugal for two years.','Meu objetivo é morar no Brasil.':'My goal is to live in Brazil.','Eu gosto muito de viajar.':'I like travelling a lot.','Prazer em conhecer você!':'Nice to meet you!','Tchau, até amanhã!':'Bye, see you tomorrow!','O rato roeu a roupa do rei de Roma.':'The mouse gnawed the clothes of the king of Rome.','Três pratos de trigo para três tigres tristes.':'Three plates of wheat for three sad tigers.','Eu moro no Brasil.':'I live in Brazil.'};\nvar si = 0, box = G.$('#speakBox');\nfunction speakRound(){ var s = S[si % S.length]; si++; box.innerHTML = '\u003cp class=\"big-say\" style=\"margin:0 0 8px\">'+s+' '+U.both(s)+'\u003c/p>\u003cp class=\"tr\">'+SE[s]+'\u003c/p>\u003cdiv class=\"listen\" id=\"ls\">\u003c/div>\u003cdiv class=\"row\">\u003cbutton type=\"button\" class=\"btn\" id=\"nextS\">Próxima frase'+G.tr('Next sentence')+'\u003c/button>\u003c/div>'; G.Listen.attach(G.$('#ls'), s); G.$('#nextS').addEventListener('click', speakRound); }\nsi = Math.floor(Math.random()*S.length); speakRound();\n\nG.Quiz.mount(G.$('#qAll'), { id:'revisao', limit:12, questions:[\n {q:'How do you say “Good morning”?', options:['Boa tarde','Bom dia','Boa noite'], answer:1, keepOrder:true},\n {q:'Which letter is \u003cb>agá\u003c/b>?', options:['G','H','J'], answer:1, keepOrder:true},\n {q:'How is \u003cb>tia\u003c/b> pronounced in Brazil?', options:['“tia”','“tchia”','“sia”'], answer:1, keepOrder:true},\n {q:'\u003cb>Eu ___ da Alemanha.\u003c/b>', options:['sou','estou','tenho'], answer:0, keepOrder:true},\n {q:'\u003cb>Eu ___ em Portugal.\u003c/b> (location)', options:['sou','estou','tenho'], answer:1, keepOrder:true},\n {q:'\u003cb>Eu ___ 48 anos.\u003c/b>', options:['sou','estou','tenho'], answer:2, keepOrder:true},\n {q:'I live \u003cb>in\u003c/b> Brazil.', options:['Eu moro em Brasil.','Eu moro no Brasil.','Eu moro na Brasil.'], answer:1, keepOrder:true},\n {q:'Which means “bus” in Brazil?', options:['autocarro','ônibus','comboio'], answer:1, keepOrder:true},\n {q:'Listen: which number?', say:'quarenta e oito', options:['18','28','48','58'], answer:2, keepOrder:true},\n {q:'Which is the Brazilian way to say “I am studying”?', options:['Estou a estudar','Estou estudando','Estudo a estar'], answer:1, keepOrder:true},\n {q:'Plural of \u003cb>pão\u003c/b>:', options:['pãos','pães','pões'], answer:1, keepOrder:true},\n {q:'A woman says thank you:', options:['obrigado','obrigada','obrigade'], answer:1, keepOrder:true},\n {q:'\u003cb>Por que\u003c/b> or \u003cb>porque\u003c/b>? “___ você quer aprender português?”', options:['Por que','Porque'], answer:0, keepOrder:true},\n {q:'The Brazilian sound of final \u003cb>l\u003c/b> in \u003cb>Brasil\u003c/b> is…', options:['l','u','r'], answer:1, keepOrder:true},\n {q:'Listen: which day?', say:'sexta-feira', options:['segunda-feira','quinta-feira','sexta-feira'], answer:2, keepOrder:true}\n]});\n})();\n\u003c/script>\n"},"09-roteiro-de-aulas.html":{"id":"roteiro","title":"Roteiro","body":"\u003ch1>Roteiro de aulas\u003cspan class=\"tr\">Lesson plan\u003c/span>\u003c/h1>\n\u003cp class=\"sec-intro\">Módulo 9 · Para a professora. Plano de 10 aulas de 60 minutos, erros previsíveis de falantes de alemão e inglês, cenas de role-play e uma lista A1 para acompanhar o progresso. As caixinhas ficam salvas neste navegador.\u003cspan class=\"tr\">Module 9 · For the teacher. A plan of 10 lessons of 60 minutes, predictable mistakes of German and English speakers, role-play scenes and an A1 checklist to track progress. The checkboxes are saved in this browser.\u003c/span>\u003c/p>\n\n\u003cdiv class=\"callout prof\" style=\"display:block!important\">\n  \u003cb class=\"t\">Como usar\u003cspan class=\"tr\"> · How to use\u003c/span>\u003c/b>\n  \u003cp>Cada aula segue o mesmo ritmo: \u003cb>aquecimento (5′) → apresentação (15′) → prática (20′) → fala (15′) → fecho (5′)\u003c/b>. O ritmo é flexível: se o Marc precisar de mais tempo nos sons, estique a aula 3 ou 4 e continue. Marque os itens concluídos.\u003c/p>\n  \u003cp class=\"tr\">Each lesson follows the same rhythm: \u003cb>warm-up (5′) → presentation (15′) → practice (20′) → speaking (15′) → wrap-up (5′)\u003c/b>. The pace is flexible: if Marc needs more time on sounds, stretch lesson 3 or 4 and carry on. Tick the completed items.\u003c/p>\n  \u003cp style=\"margin:0\">\u003cbutton type=\"button\" class=\"btn sm\" onclick=\"window.print()\">Imprimir este roteiro\u003cspan class=\"tr\"> · Print this plan\u003c/span>\u003c/button>\u003c/p>\n\u003c/div>\n\n\u003ch2>1. Plano de 10 aulas\u003cspan class=\"tr\"> · 10-lesson plan\u003c/span>\u003c/h2>\n\u003cdiv id=\"lessons\">\u003c/div>\n\n\u003ch2>2. Erros previsíveis (alemão e inglês → português do Brasil)\u003cspan class=\"tr\"> · Predictable mistakes (German and English → Brazilian Portuguese)\u003c/span>\u003c/h2>\n\u003cdiv id=\"errors\">\u003c/div>\n\n\u003ch2>3. Rotina de estudo do Marc\u003cspan class=\"tr\"> · Marc's study routine\u003c/span>\u003c/h2>\n\u003cdiv class=\"grid g3\">\n  \u003cdiv class=\"card\">\u003ch3>Todo dia · 10 min\u003cspan class=\"tr\"> · Every day\u003c/span>\u003c/h3>\u003cp style=\"margin:0\">Flashcards de \u003ca href=\"08-praticar.html\">Praticar\u003c/a>, 5 palavras novas, e ouvir os áudios da aula.\u003cspan class=\"tr\" style=\"display:block\">Flashcards from Practice, 5 new words, and listening to the lesson audio.\u003c/span>\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3>3× por semana · 15 min\u003cspan class=\"tr\"> · 3× a week\u003c/span>\u003c/h3>\u003cp style=\"margin:0\">Ouvir algo em português brasileiro (podcast, série, música) e repetir 3 frases.\u003cspan class=\"tr\" style=\"display:block\">Listen to something in Brazilian Portuguese (podcast, series, music) and repeat 3 sentences.\u003c/span>\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3>1× por semana · 5 min\u003cspan class=\"tr\"> · 1× a week\u003c/span>\u003c/h3>\u003cp style=\"margin:0\">Gravar um áudio contando a semana e enviar para a professora corrigir.\u003cspan class=\"tr\" style=\"display:block\">Record an audio telling about the week and send it to the teacher for correction.\u003c/span>\u003c/p>\u003c/div>\n\u003c/div>\n\n\u003ch2>4. Cenas de role-play: “Chegando ao Brasil”\u003cspan class=\"tr\"> · Role-play scenes: “Arriving in Brazil”\u003c/span>\u003c/h2>\n\u003cdiv id=\"roles\">\u003c/div>\n\n\u003ch2>5. Lista A1: eu consigo…\u003cspan class=\"tr\"> · A1 checklist: I can…\u003c/span>\u003c/h2>\n\u003cdiv class=\"card\" id=\"a1\">\u003c/div>\n\n\u003cscript>\n(function(){\nvar G = window.G, U = G.UI, tr = G.tr;\n/* t/te = title, obj/objE = objective, steps [pt, en], hw/hwE = homework */\nvar LS = [\n {t:'Boas-vindas e primeiros sons',te:'Welcome and first sounds',m:'01-comecando.html',obj:'Cumprimentar, dizer o nome, usar frases de sala de aula, fazer a autoavaliação.',objE:'Greet, say your name, use classroom phrases, do the self-assessment.',\n  steps:[['Aquecimento: “Oi! Tudo bem?” em duplas (você e o Marc).','Warm-up: “Oi! Tudo bem?” in pairs (you and Marc).'],['Apresentação: Brasil × Portugal em 3 min; cognatos e falsos amigos.','Presentation: Brazil vs Portugal in 3 min; cognates and false friends.'],['Prática: flashcards das primeiras palavras, mini-diálogo, frases de sala de aula.','Practice: first-words flashcards, mini dialogue, classroom phrases.'],['Fala: “Meu nome é Marc. Eu sou da Alemanha.”','Speaking: “My name is Marc. I am from Germany.”'],['Fecho: autoavaliação “Onde você está hoje?”','Wrap-up: self-assessment “Where are you today?”']],\n  hw:'10 min de flashcards por dia; gravar “Oi, meu nome é Marc”.',hwE:'10 min of flashcards a day; record “Oi, meu nome é Marc”.'},\n {t:'Alfabeto e soletrar',te:'Alphabet and spelling',m:'02-alfabeto.html',obj:'Nomear as 26 letras, soletrar nome, e-mail e palavras em voz alta.',objE:'Name the 26 letters, spell your name, e-mail and words out loud.',\n  steps:[['Aquecimento: revisar cumprimentos.','Warm-up: review greetings.'],['Apresentação: letras com áudio; R, H, X, G, J; nome “Márki”.','Presentation: letters with audio; R, H, X, G, J; the name “Márki”.'],['Prática: “Ouça e escolha a letra”; soletrar o nome; “A de avião”.','Practice: “Listen and choose the letter”; spell the name; “A de avião”.'],['Fala: soletrar o nome, o e-mail e o endereço.','Speaking: spell the name, the e-mail and the address.'],['Fecho: mini-ditado de 5 palavras.','Wrap-up: mini dictation of 5 words.']],\n  hw:'Soletrar 10 palavras do dia a dia em voz alta.',hwE:'Spell 10 everyday words out loud.'},\n {t:'Sons do Brasil I',te:'Sounds of Brazil I',m:'03-sons-e-fonetica.html',obj:'Vogais orais, nasais, “e” e “o” finais, t/d + i.',objE:'Oral vowels, nasals, final “e” and “o”, t/d + i.',\n  steps:[['Aquecimento: pares avô/avó, ovo/ovos.','Warm
